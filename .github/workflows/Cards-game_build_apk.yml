name: Build Multiplayer Cards & Board Games APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Project
        run: |
          mkdir -p game_app/app/src/main/java/com/sagar/gameshub
          mkdir -p game_app/app/src/main/res/values
          mkdir -p game_app/app/src/main/assets

          # Copy index.html into app assets
          cp index.html game_app/app/src/main/assets/index.html

          # 1. gradle.properties
          cat << 'EOF' > game_app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 2. settings.gradle
          cat << 'EOF' > game_app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AllInOneGamesHub"
          include ':app'
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > game_app/build.gradle
          plugins {
              id 'com.android.application' version '8.4.1' apply false
          }
          EOF

          # 4. App build.gradle
          cat << 'EOF' > game_app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sagar.gameshub'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sagar.gameshub"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > game_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:label="Card &amp; Board Games Hub"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. MainActivity.java
          cat << 'EOF' > game_app/app/src/main/java/com/sagar/gameshub/MainActivity.java
          package com.sagar.gameshub;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Standalone APK
        run: |
          cd game_app
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon

      - name: Upload Games APK
        uses: actions/upload-artifact@v4
        with:
          name: All-In-One-Card-Games-Hub-APK
          path: game_app/app/build/outputs/apk/debug/*.apk
