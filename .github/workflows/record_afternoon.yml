name: Record AIR FM Rainbow - Afternoon Session

on:
  schedule:
    # 07:30 UTC = 01:00 PM IST
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  record-afternoon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl

      - name: Record Afternoon Slices (01 PM - 07 PM IST)
        run: |
          mkdir -p output temp_chunks

          CONFIG_URL="https://raw.githubusercontent.com/sagarrawatssr/air-fm-recorder/main/streams.json"
          echo "Fetching dynamic endpoints from: $CONFIG_URL"
          STREAM_CONFIG=$(curl -sSL "$CONFIG_URL" || echo "")

          CANDIDATES=()
          if [ -n "$STREAM_CONFIG" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && CANDIDATES+=("$line")
            done < <(echo "$STREAM_CONFIG" | jq -r '.active_stream, .fallback_streams[]' 2>/dev/null || echo "$STREAM_CONFIG" | grep -o 'https://[^"]*')
          fi

          if [ ${#CANDIDATES[@]} -eq 0 ]; then
            CANDIDATES=(
              "https://d3r9rhourdc02u.cloudfront.net/assets/radio/airdelhi02/air002_Auto.m3u8"
              "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8"
              "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio004_Auto.m3u8"
            )
          fi

          probe_stream() {
            local target_url="$1"
            if ffprobe -v error -rw_timeout 6000000 -t 3 -show_entries stream=codec_type \
               -headers "User-Agent: Mozilla/5.0" \
               -of default=noprint_wrappers=1:nokey=1 "$target_url" 2>/dev/null | grep -q "audio"; then
              return 0
            fi
            return 1
          }

          # Afternoon Slots: 06 (01-02 PM) to 11 (06-07 PM)
          AFTERNOON_SLOTS=("06" "07" "08" "09" "10" "11")

          for slot in "${AFTERNOON_SLOTS[@]}"; do
            echo "=========================================="
            echo "Starting Afternoon Slot: hour_${slot}"
            echo "=========================================="

            TARGET_DURATION=3600
            TOTAL_CAPTURED=0
            CHUNK_INDEX=0
            rm -rf temp_chunks/*
            > temp_chunks/concat_list.txt

            CANDIDATE_INDEX=0
            NUM_CANDIDATES=${#CANDIDATES[@]}

            while [ "$TOTAL_CAPTURED" -lt "$TARGET_DURATION" ] && [ "$CANDIDATE_INDEX" -lt "$NUM_CANDIDATES" ]; do
              REMAINING_SECS=$(( TARGET_DURATION - TOTAL_CAPTURED ))
              CURRENT_URL="${CANDIDATES[$CANDIDATE_INDEX]}"

              echo "Attempting stream candidate [$CANDIDATE_INDEX]: $CURRENT_URL"
              if ! probe_stream "$CURRENT_URL"; then
                echo "Stream probe failed or inactive. Switching to next mirror..."
                CANDIDATE_INDEX=$(( CANDIDATE_INDEX + 1 ))
                continue
              fi

              CHUNK_FILE="temp_chunks/chunk_${CHUNK_INDEX}.mp3"

              ffmpeg -nostdin -y \
                -headers "User-Agent: Mozilla/5.0" \
                -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 10 \
                -rw_timeout 15000000 \
                -err_detect ignore_err -fflags +nobuffer+flush_packets+discardcorrupt \
                -live_start_index -1 \
                -i "$CURRENT_URL" \
                -t "$REMAINING_SECS" \
                -c:a libmp3lame -b:a 64k -ac 1 \
                "$CHUNK_FILE" || true

              CHUNK_SECS=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$CHUNK_FILE" 2>/dev/null | cut -d. -f1 || echo 0)
              CHUNK_SECS=${CHUNK_SECS:-0}

              if [ "$CHUNK_SECS" -gt 10 ]; then
                echo "Captured valid chunk ${CHUNK_INDEX} (${CHUNK_SECS} seconds)."
                echo "file '$(pwd)/${CHUNK_FILE}'" >> temp_chunks/concat_list.txt
                TOTAL_CAPTURED=$(( TOTAL_CAPTURED + CHUNK_SECS ))
                CHUNK_INDEX=$(( CHUNK_INDEX + 1 ))
              else
                echo "Chunk too short ($CHUNK_SECS s). Removing."
                rm -f "$CHUNK_FILE"
              fi

              if [ "$TOTAL_CAPTURED" -lt "$TARGET_DURATION" ]; then
                echo "Stream halted early (Captured: ${TOTAL_CAPTURED}s / ${TARGET_DURATION}s). Switching to fallback mirror..."
                CANDIDATE_INDEX=$(( CANDIDATE_INDEX + 1 ))
                sleep 3
              fi
            done

            REC_DATE="$(TZ='Asia/Kolkata' date +'%Y-%m-%d')"
            DATE_TAG="archive-${REC_DATE}"
            FINAL_OUTPUT="output/${REC_DATE}_hour_${slot}.mp3"

            if [ "$CHUNK_INDEX" -gt 0 ]; then
              if [ "$CHUNK_INDEX" -eq 1 ]; then
                mv "temp_chunks/chunk_0.mp3" "$FINAL_OUTPUT"
              else
                echo "Stitching $CHUNK_INDEX chunks into final hour file..."
                ffmpeg -y -f concat -safe 0 -i temp_chunks/concat_list.txt -c copy "$FINAL_OUTPUT"
              fi

              FILE_SIZE=$(stat -c%s "$FINAL_OUTPUT" 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -gt 1500000 ]; then
                MAX_VOL=$(ffmpeg -i "$FINAL_OUTPUT" -af "volumedetect" -f null /dev/null 2>&1 | grep "max_volume:" | awk '{print $5}' | cut -d. -f1 || echo "-99")
                
                if [ "$MAX_VOL" != "-99" ] && [ "$MAX_VOL" -gt -65 ]; then
                  gh release view "$DATE_TAG" || gh release create "$DATE_TAG" --title "Radio Archive ${REC_DATE}" --notes "Archive for ${REC_DATE}"
                  gh release upload "$DATE_TAG" "$FINAL_OUTPUT" --clobber
                  echo "Successfully uploaded $FINAL_OUTPUT (Size: $(( FILE_SIZE / 1024 )) KB, Max Volume: ${MAX_VOL} dB)"
                else
                  echo "Discarded $FINAL_OUTPUT: Detected pure silence (Volume: ${MAX_VOL} dB)."
                  rm -f "$FINAL_OUTPUT"
                fi
              else
                echo "Discarded $FINAL_OUTPUT: File size below threshold ($FILE_SIZE bytes)."
                rm -f "$FINAL_OUTPUT"
              fi
            else
              echo "Failed to record valid audio for slot hour_${slot}."
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
