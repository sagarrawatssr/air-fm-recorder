name: "2. Record FM Rainbow (01 PM - 07 PM)"

on:
  schedule:
    # 1:00 PM IST is 07:30 AM UTC
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record_afternoon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg gh

      - name: Record & Upload Hourly (Hours 06 to 11)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          DATE_STR="$(TZ='Asia/Kolkata' date +'%Y-%m-%d')"
          DATE_TAG="archive-${DATE_STR}"
          STREAM_URL="https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8"

          gh release view "$DATE_TAG" || gh release create "$DATE_TAG" --title "Radio Archive ${DATE_STR}" --notes "Daily recordings for ${DATE_STR}"

          # Loop through afternoon hours 06 to 11 (1 PM - 7 PM)
          for i in $(seq -w 6 11); do
            FILE_NAME="${DATE_STR}_hour_${i}.mp3"
            echo "Recording ${FILE_NAME}..."

            ffmpeg -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -i "$STREAM_URL" \
              -t 3600 \
              -c:a libmp3lame -b:a 64k -ac 1 \
              "output/$FILE_NAME"

            echo "Uploading ${FILE_NAME}..."
            gh release upload "$DATE_TAG" "output/$FILE_NAME" --clobber
            echo "Uploaded ${FILE_NAME} successfully!"
          done

          echo "Purging recordings older than 30 days..."
          EXPIRED_TAG="archive-$(TZ='Asia/Kolkata' date -d '31 days ago' +'%Y-%m-%d')"
          gh release delete "$EXPIRED_TAG" --yes --cleanup-tag || true
