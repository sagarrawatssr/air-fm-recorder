name: Record AIR FM Rainbow - Evening Broadcast

on:
  schedule:
    # 07:30 UTC = 01:00 PM IST (Runs 6 slots of 1 hr from 01:00 PM to 07:00 PM IST)
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  record-evening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and JQ
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl

      - name: Setup IST Date and Time
        id: time_setup
        run: |
          DATE_STR=$(TZ="Asia/Kolkata" date +'%Y-%m-%d')
          echo "date_str=$DATE_STR" >> $GITHUB_OUTPUT
          echo "Current IST Date: $DATE_STR"

      - name: Record 6 Hourly Slices (01 PM to 07 PM IST)
        env:
          DATE_STR: ${{ steps.time_setup.outputs.date_str }}
        run: |
          mkdir -p recordings

          CANDIDATES=(
            "https://d3r9rhourdc02u.cloudfront.net/assets/radio/airdelhi02/air002_Auto.m3u8"
            "https://calm-tooth-bdc9.sagarsinghrawat162020.workers.dev/https://d3r9rhourdc02u.cloudfront.net/assets/radio/airdelhi02/air002_Auto.m3u8"
          )

          if [ -f "streams.json" ]; then
            JSON_STREAM=$(jq -r '.active_stream' streams.json)
            if [ -n "$JSON_STREAM" ] && [ "$JSON_STREAM" != "null" ]; then
              CANDIDATES+=("$JSON_STREAM")
            fi
          fi

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          REFERER="https://newsonair.gov.in/"

          probe_stream() {
            local url="$1"
            echo "Probing candidate URL: $url"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L \
              -A "$USER_AGENT" \
              -H "Referer: $REFERER" \
              --connect-timeout 10 \
              --max-time 15 \
              "$url")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Probe Success: Stream is live (HTTP 200)."
              return 0
            else
              echo "Probe Failed: Received HTTP $HTTP_CODE."
              return 1
            fi
          }

          SELECTED_URL=""
          for candidate in "${CANDIDATES[@]}"; do
            if probe_stream "$candidate"; then
              SELECTED_URL="$candidate"
              break
            fi
          done

          if [ -z "$SELECTED_URL" ]; then
            echo "Fatal Error: No active candidate stream responded. Exiting."
            exit 1
          fi

          echo "Using Active Stream: $SELECTED_URL"

          # Record 6 hours (hour_06 to hour_11) sequentially
          # hour_06: 01-02 PM, hour_07: 02-03 PM, hour_08: 03-04 PM
          # hour_09: 04-05 PM, hour_10: 05-06 PM, hour_11: 06-07 PM
          for i in {6..11}; do
            SLOT_INDEX=$(printf "%02d" $i)
            OUT_FILE="recordings/${DATE_STR}_hour_${SLOT_INDEX}.mp3"
            echo "Starting Recording for Slot ${SLOT_INDEX}: $OUT_FILE"

            ffmpeg -hide_banner -loglevel warning \
              -headers "User-Agent: $USER_AGENT"$'\r\n'"Referer: $REFERER"$'\r\n' \
              -i "$SELECTED_URL" \
              -t 3600 \
              -c:a libmp3lame -b:a 128k \
              "$OUT_FILE" || true

            if [ -f "$OUT_FILE" ] && [ $(stat -c%s "$OUT_FILE") -gt 1000000 ]; then
              echo "Slot ${SLOT_INDEX} recorded successfully."
            else
              echo "Warning: Slot ${SLOT_INDEX} output is missing or too small."
            fi
          done

      - name: Publish Evening Archive to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE_STR: ${{ steps.time_setup.outputs.date_str }}
        run: |
          TAG="archive-${DATE_STR}"
          TITLE="AIR FM Rainbow Archive - ${DATE_STR}"

          gh release view "$TAG" || gh release create "$TAG" --title "$TITLE" --notes "Daily Broadcast Archives for $DATE_STR"
          gh release upload "$TAG" recordings/*.mp3 --clobber
