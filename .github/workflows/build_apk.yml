name: Build Native VLC-Style Radio APK

on:
  workflow_dispatch:

jobs:
  build_native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Scaffold Native Android Project with Foreground Audio Service
        run: |
          mkdir -p android_app/app/src/main/java/com/sagarrawatssr/airfm
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/assets
          
          # Copy your index.html into native assets
          cp index.html android_app/app/src/main/assets/index.html

          # 1. Project-level build.gradle
          cat << 'EOF' > android_app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 2. settings.gradle
          echo "include ':app'" > android_app/settings.gradle

          # 3. app/build.gradle
          cat << 'EOF' > android_app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sagarrawatssr.airfm'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sagarrawatssr.airfm"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # 4. AndroidManifest.xml with Foreground Service & WakeLock
          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <application
                  android:allowBackup="true"
                  android:label="AIR FM Rainbow"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RadioPlaybackService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          # 5. Foreground Service (Keeps audio CPU thread alive in background)
          cat << 'EOF' > android_app/app/src/main/java/com/sagarrawatssr/airfm/RadioPlaybackService.java
          package com.sagarrawatssr.airfm;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class RadioPlaybackService extends Service {
              private static final String CHANNEL_ID = "air_fm_playback_channel";
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "airfm:wake");
                      wakeLock.acquire();
                  }
                  createNotificationChannel();
                  startForeground(101, buildNotification());
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "AIR FM Playback",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              private Notification buildNotification() {
                  Intent notificationIntent = new Intent(this, MainActivity.class);
                  PendingIntent pendingIntent = PendingIntent.getActivity(
                          this, 0, notificationIntent,
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0
                  );

                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, CHANNEL_ID)
                          : new Notification.Builder(this);

                  return builder
                          .setContentTitle("AIR FM Rainbow")
                          .setContentText("Playing in Background")
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 6. MainActivity (Starts service, enables background JS/Media execution, bypasses focus)
          cat << 'EOF' > android_app/app/src/main/java/com/sagarrawatssr/airfm/MainActivity.java
          package com.sagarrawatssr.airfm;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Build;
          import android.media.AudioAttributes;
          import android.media.AudioFocusRequest;
          import android.media.AudioManager;
          import android.content.Context;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private AudioManager audioManager;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // 1. Start Sticky Foreground Service so OS never sleeps the process
                  Intent serviceIntent = new Intent(this, RadioPlaybackService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }

                  // 2. Audio Focus Bypass (VLC style ignore)
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (audioManager != null) {
                      AudioManager.OnAudioFocusChangeListener dummyListener = focusChange -> {
                          // DO NOTHING -> Do not yield or pause when other audio starts
                      };
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          AudioAttributes attrs = new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build();
                          AudioFocusRequest focusRequest = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                                  .setAudioAttributes(attrs)
                                  .setAcceptsDelayedFocusGain(false)
                                  .setWillPauseWhenDucked(false)
                                  .setOnAudioFocusChangeListener(dummyListener)
                                  .build();
                          audioManager.requestAudioFocus(focusRequest);
                      } else {
                          audioManager.requestAudioFocus(dummyListener, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
                      }
                  }

                  // 3. Configure WebView with persistent background execution
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  // CRITICAL: DO NOT call webView.onPause(). 
                  // Keeping webView running lets playback continue in the background!
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  // Prevent the OS from freezing the JavaScript thread
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (webView != null) {
                      webView.destroy();
                  }
                  stopService(new Intent(this, RadioPlaybackService.class));
              }
          }
          EOF

      - name: Setup Gradle 8.4 Wrapper
        run: |
          cd android_app
          gradle wrapper --gradle-version 8.4

      - name: Build Standalone Debug APK
        run: |
          cd android_app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-FM-Rainbow-VLC-Style-APK
          path: android_app/app/build/outputs/apk/debug/*.apk
