name: Build Native Background Radio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Standalone Cordova App with Background Audio Mode
        run: |
          npm install -g cordova
          cordova create native_radio com.sagarrawatssr.airfmrainbow "AIR FM Rainbow"
          cd native_radio
          
          # 1. Copy web assets
          rm -rf www/*
          cp ../index.html www/index.html

          # 2. Add native plugins for Background Execution and Audio Focus Override
          cordova plugin add cordova-plugin-background-mode
          
          # 3. Add Android Platform
          cordova platform add android@12.0.0

          # 4. Patch MainActivity to abandon Android Audio Focus completely
          MAIN_ACTIVITY_PATH=$(find platforms/android/app/src/main/java -name "MainActivity.java")
          cat << 'EOF' > "$MAIN_ACTIVITY_PATH"
          package com.sagarrawatssr.airfmrainbow;

          import android.os.Bundle;
          import android.media.AudioManager;
          import android.content.Context;
          import org.apache.cordova.*;

          public class MainActivity extends CordovaActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  super.init();
                  launchUrl = BuildConfig.USE_CACHE ? "file:///android_asset/www/index.html" : launchUrl;
                  loadUrl(launchUrl);

                  // Disable system audio focus loss
                  AudioManager audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (audioManager != null) {
                      audioManager.abandonAudioFocus(null);
                  }
              }
          }
          EOF

          # 5. Compile Debug APK
          cordova build android --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-FM-Rainbow-Native-APK
          path: native_radio/platforms/android/app/build/outputs/apk/debug/*.apk
