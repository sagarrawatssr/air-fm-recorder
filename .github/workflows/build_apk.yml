name: Build Native VLC-Style Radio APK

on:
  workflow_dispatch:

jobs:
  build_native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Scaffold Native Android Project with Audio Focus Bypass
        run: |
          mkdir -p android_app/app/src/main/java/com/sagarrawatssr/airfm
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/assets
          
          # Copy your index.html into native assets
          cp index.html android_app/app/src/main/assets/index.html

          # 1. Project-level build.gradle
          cat << 'EOF' > android_app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 2. settings.gradle
          echo "include ':app'" > android_app/settings.gradle

          # 3. app/build.gradle (Zero external dependencies to avoid runtime classpath conflicts)
          cat << 'EOF' > android_app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sagarrawatssr.airfm'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sagarrawatssr.airfm"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:allowBackup="true"
                  android:label="AIR FM Rainbow"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Native Java Code (Standard Android Activity + Audio Focus Bypass)
          cat << 'EOF' > android_app/app/src/main/java/com/sagarrawatssr/airfm/MainActivity.java
          package com.sagarrawatssr.airfm;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.media.AudioAttributes;
          import android.media.AudioFocusRequest;
          import android.media.AudioManager;
          import android.content.Context;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private AudioManager audioManager;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Native Audio Focus Bypass: Consume focus loss so background apps won't pause playback
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (audioManager != null) {
                      AudioManager.OnAudioFocusChangeListener dummyListener = focusChange -> {
                          // DO NOTHING -> Never pause when other audio starts
                      };
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          AudioAttributes attrs = new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build();
                          AudioFocusRequest focusRequest = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                                  .setAudioAttributes(attrs)
                                  .setAcceptsDelayedFocusGain(false)
                                  .setWillPauseWhenDucked(false)
                                  .setOnAudioFocusChangeListener(dummyListener)
                                  .build();
                          audioManager.requestAudioFocus(focusRequest);
                      } else {
                          audioManager.requestAudioFocus(dummyListener, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
                      }
                  }

                  // Hardware Accelerated Fullscreen WebView
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (webView != null) {
                      webView.destroy();
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.4 Wrapper
        run: |
          cd android_app
          gradle wrapper --gradle-version 8.4

      - name: Build Standalone Debug APK
        run: |
          cd android_app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-FM-Rainbow-VLC-Style-APK
          path: android_app/app/build/outputs/apk/debug/*.apk
