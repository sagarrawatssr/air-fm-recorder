name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android APK via Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

          # Configure Bubblewrap paths
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          mkdir -p app_build && cd app_build

          # Create a local twa-manifest.json directly so no remote 404 can happen
          cat <<EOF > twa-manifest.json
          {
            "packageId": "com.sagarrawatssr.airfmrainbow",
            "host": "sagarrawatssr.github.io",
            "name": "AIR FM Rainbow",
            "launcherName": "FM Rainbow",
            "themeColor": "#0b0f19",
            "navigationColor": "#0b0f19",
            "backgroundColor": "#0b0f19",
            "startUrl": "/air-fm-recorder/index.html",
            "iconUrl": "https://raw.githubusercontent.com/sagarrawatssr/air-fm-recorder/main/icon.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/sagarrawatssr/air-fm-recorder/main/icon.png",
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://sagarrawatssr.github.io/air-fm-recorder/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false
          }
          EOF

          # Download a default app icon if one doesn't exist
          curl -s -L -o icon.png "https://cdn-icons-png.flaticon.com/512/3075/3075908.png"

          # Generate the Android project from the local file
          npx @bubblewrap/cli build --skipSigning

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-FM-Rainbow-APK
          path: app_build/*.apk
