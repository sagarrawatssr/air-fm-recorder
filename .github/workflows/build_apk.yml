name: Build Clean Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Native APK via Cordova
        run: |
          npm install -g cordova
          cordova create fm_app com.sagarrawatssr.airfmrainbow "AIR FM Rainbow"
          cd fm_app
          
          # Replace default cordova assets with your exact index.html
          rm -rf www/*
          cp ../index.html www/index.html
          
          # Add standard Android platform and compile release/debug APK
          cordova platform add android
          cordova build android --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-FM-Rainbow-Clean-APK
          path: fm_app/platforms/android/app/build/outputs/apk/debug/*.apk
