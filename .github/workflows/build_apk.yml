name: Build Dual Audio Radio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build App Project
        run: |
          mkdir -p native_app/app/src/main/java/com/sagar/airfm
          mkdir -p native_app/app/src/main/res/values
          mkdir -p native_app/app/src/main/assets

          # Copy index.html into assets
          cp index.html native_app/app/src/main/assets/index.html

          # 1. gradle.properties
          cat << 'EOF' > native_app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > native_app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          echo "include ':app'" > native_app/settings.gradle

          # 3. App build.gradle
          cat << 'EOF' > native_app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sagar.airfm'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sagar.airfm"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'androidx.media:media:1.7.0'
          }
          EOF

          # 4. AndroidManifest.xml (Registers Broadcast Receiver for notification buttons)
          cat << 'EOF' > native_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="AIR FM Rainbow"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RadioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="false" />
                  <receiver android:name=".MediaNotificationReceiver" android:exported="false" />
              </application>
          </manifest>
          EOF

          # 5. MediaNotificationReceiver.java (Guaranteed notification button clicks)
          cat << 'EOF' > native_app/app/src/main/java/com/sagar/airfm/MediaNotificationReceiver.java
          package com.sagar.airfm;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class MediaNotificationReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (RadioService.instance != null) {
                      String action = intent.getAction();
                      if ("ACTION_TOGGLE".equals(action)) {
                          RadioService.instance.toggle();
                      } else if ("ACTION_SEEK_BACK".equals(action)) {
                          RadioService.instance.seekDelta(-10000);
                      } else if ("ACTION_SEEK_FWD".equals(action)) {
                          RadioService.instance.seekDelta(10000);
                      }
                  }
              }
          }
          EOF

          # 6. RadioService.java (Full MediaSession + Progress synchronization loop)
          cat << 'EOF' > native_app/app/src/main/java/com/sagar/airfm/RadioService.java
          package com.sagar.airfm;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Binder;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.support.v4.media.MediaMetadataCompat;
          import android.support.v4.media.session.MediaSessionCompat;
          import android.support.v4.media.session.PlaybackStateCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.Player;
          import androidx.media3.exoplayer.ExoPlayer;

          public class RadioService extends Service {
              public static RadioService instance;
              private ExoPlayer player;
              private MediaSessionCompat mediaSession;
              private String currentTitle = "AIR FM Rainbow 102.6 MHz";
              private String currentSub = "Live Broadcast";
              private final IBinder binder = new LocalBinder();
              private final Handler progressHandler = new Handler(Looper.getMainLooper());
              private MainActivity mainActivity;

              public class LocalBinder extends Binder {
                  public RadioService getService() { return RadioService.this; }
              }

              public void registerActivity(MainActivity activity) {
                  this.mainActivity = activity;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  createChannel();

                  mediaSession = new MediaSessionCompat(this, "AirFmAudioSession");
                  mediaSession.setCallback(new MediaSessionCompat.Callback() {
                      @Override
                      public void onPlay() { toggle(); }
                      @Override
                      public void onPause() { toggle(); }
                      @Override
                      public void onSeekTo(long pos) {
                          if (player != null) player.seekTo(pos);
                      }
                  });
                  mediaSession.setActive(true);

                  // ExoPlayer without internal audio focus constraints (Dual Audio)
                  player = new ExoPlayer.Builder(this).build();
                  player.addListener(new Player.Listener() {
                      @Override
                      public void onIsPlayingChanged(boolean isPlaying) {
                          updateNotification(isPlaying);
                          if (mainActivity != null) {
                              mainActivity.notifyPlayStateToWeb(isPlaying);
                          }
                      }
                  });

                  startForeground(101, buildMediaNotification(false));
                  startProgressTicker();
              }

              private void startProgressTicker() {
                  progressHandler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null && player.isPlaying() && mainActivity != null) {
                              long cur = player.getCurrentPosition();
                              long dur = player.getDuration();
                              if (dur < 0) dur = 0;
                              mainActivity.sendProgressToWeb(cur, dur);
                          }
                          progressHandler.postDelayed(this, 500);
                      }
                  }, 500);
              }

              public void playUrl(String streamUrl, String title, String sub) {
                  this.currentTitle = (title != null && !title.isEmpty()) ? title : "AIR FM Rainbow";
                  this.currentSub = (sub != null && !sub.isEmpty()) ? sub : "Broadcast";
                  if (player != null) {
                      player.stop();
                      player.clearMediaItems();
                      player.setMediaItem(MediaItem.fromUri(streamUrl));
                      player.prepare();
                      player.play();
                      updateNotification(true);
                  }
              }

              public void toggle() {
                  if (player != null) {
                      if (player.isPlaying()) {
                          player.pause();
                      } else {
                          player.play();
                      }
                  }
              }

              public void seekDelta(long deltaMs) {
                  if (player != null) {
                      long target = Math.max(0, Math.min(player.getDuration(), player.getCurrentPosition() + deltaMs));
                      player.seekTo(target);
                  }
              }

              public void seekTo(long targetMs) {
                  if (player != null) {
                      player.seekTo(targetMs);
                  }
              }

              public boolean isPlaying() {
                  return player != null && player.isPlaying();
              }

              private void updateNotification(boolean isPlaying) {
                  long actions = PlaybackStateCompat.ACTION_PLAY_PAUSE | PlaybackStateCompat.ACTION_PLAY | PlaybackStateCompat.ACTION_PAUSE;
                  int state = isPlaying ? PlaybackStateCompat.STATE_PLAYING : PlaybackStateCompat.STATE_PAUSED;
                  long cur = player != null ? player.getCurrentPosition() : 0;

                  mediaSession.setPlaybackState(new PlaybackStateCompat.Builder()
                          .setActions(actions)
                          .setState(state, cur, 1.0f)
                          .build());

                  mediaSession.setMetadata(new MediaMetadataCompat.Builder()
                          .putString(MediaMetadataCompat.METADATA_KEY_TITLE, currentTitle)
                          .putString(MediaMetadataCompat.METADATA_KEY_ARTIST, currentSub)
                          .putLong(MediaMetadataCompat.METADATA_KEY_DURATION, player != null ? player.getDuration() : 0)
                          .build());

                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (nm != null) {
                      nm.notify(101, buildMediaNotification(isPlaying));
                  }
              }

              private Notification buildMediaNotification(boolean isPlaying) {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent piOpen = PendingIntent.getActivity(
                          this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Intent toggleIntent = new Intent(this, MediaNotificationReceiver.class).setAction("ACTION_TOGGLE");
                  PendingIntent piToggle = PendingIntent.getBroadcast(
                          this, 1, toggleIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE
                  );

                  Intent backIntent = new Intent(this, MediaNotificationReceiver.class).setAction("ACTION_SEEK_BACK");
                  PendingIntent piBack = PendingIntent.getBroadcast(
                          this, 2, backIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE
                  );

                  Intent fwdIntent = new Intent(this, MediaNotificationReceiver.class).setAction("ACTION_SEEK_FWD");
                  PendingIntent piFwd = PendingIntent.getBroadcast(
                          this, 3, fwdIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE
                  );

                  int actionIcon = isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play;
                  String actionTitle = isPlaying ? "Pause" : "Play";

                  return new NotificationCompat.Builder(this, "radio_media_channel")
                          .setContentTitle(currentTitle)
                          .setContentText(currentSub)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentIntent(piOpen)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setOngoing(isPlaying)
                          .addAction(android.R.drawable.ic_media_rew, "-10s", piBack)
                          .addAction(actionIcon, actionTitle, piToggle)
                          .addAction(android.R.drawable.ic_media_ff, "+10s", piFwd)
                          .setStyle(new androidx.media.app.NotificationCompat.MediaStyle()
                                  .setMediaSession(mediaSession.getSessionToken())
                                  .setShowActionsInCompactView(1))
                          .build();
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                              "radio_media_channel",
                              "Radio Media Player",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  progressHandler.removeCallbacksAndMessages(null);
                  if (player != null) player.release();
                  if (mediaSession != null) mediaSession.release();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return binder; }
          }
          EOF

          # 7. MainActivity.java (Bridges two-way communication with WebView)
          cat << 'EOF' > native_app/app/src/main/java/com/sagar/airfm/MainActivity.java
          package com.sagar.airfm;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private RadioService service;
              private boolean bound = false;

              private final ServiceConnection conn = new ServiceConnection() {
                  @Override
                  public void onServiceConnected(ComponentName name, IBinder b) {
                      service = ((RadioService.LocalBinder) b).getService();
                      bound = true;
                      service.registerActivity(MainActivity.this);
                  }
                  @Override
                  public void onServiceDisconnected(ComponentName name) {
                      bound = false;
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  Intent intent = new Intent(this, RadioService.class);
                  startForegroundService(intent);
                  bindService(intent, conn, Context.BIND_AUTO_CREATE);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void play(String url, String title, String sub) {
                          runOnUiThread(() -> {
                              if (bound && service != null) service.playUrl(url, title, sub);
                          });
                      }

                      @JavascriptInterface
                      public void toggle() {
                          runOnUiThread(() -> {
                              if (bound && service != null) service.toggle();
                          });
                      }

                      @JavascriptInterface
                      public void seekDelta(long deltaMs) {
                          runOnUiThread(() -> {
                              if (bound && service != null) service.seekDelta(deltaMs);
                          });
                      }

                      @JavascriptInterface
                      public void seekTo(long targetMs) {
                          runOnUiThread(() -> {
                              if (bound && service != null) service.seekTo(targetMs);
                          });
                      }
                  }, "NativeAudioBridge");

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public void sendProgressToWeb(long currentMs, long durationMs) {
                  runOnUiThread(() -> {
                      if (webView != null) {
                          webView.evaluateJavascript("window.updatePlayerProgress && window.updatePlayerProgress(" + currentMs + "," + durationMs + ");", null);
                      }
                  });
              }

              public void notifyPlayStateToWeb(boolean isPlaying) {
                  runOnUiThread(() -> {
                      if (webView != null) {
                          webView.evaluateJavascript("window.onNativePlayState && window.onNativePlayState(" + isPlaying + ");", null);
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  if (bound) unbindService(conn);
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: |
          cd native_app
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-FM-Rainbow-Full-App
          path: native_app/app/build/outputs/apk/debug/*.apk
