name: Build Native VLC-Style Radio APK

on:
  workflow_dispatch:

jobs:
  build_native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Scaffold Android Media Project
        run: |
          mkdir -p android_app/app/src/main/java/com/sagarrawatssr/airfm
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/res/drawable
          mkdir -p android_app/app/src/main/assets
          
          # Copy your updated index.html
          cp index.html android_app/app/src/main/assets/index.html

          # 1. Project-level build.gradle
          cat << 'EOF' > android_app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 2. settings.gradle
          echo "include ':app'" > android_app/settings.gradle

          # 3. app/build.gradle
          cat << 'EOF' > android_app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sagarrawatssr.airfm'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sagarrawatssr.airfm"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:label="AIR FM Rainbow"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RadioPlaybackService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          # 5. RadioPlaybackService.java (Native Player + MediaSession Notification Panel)
          cat << 'EOF' > android_app/app/src/main/java/com/sagarrawatssr/airfm/RadioPlaybackService.java
          package com.sagarrawatssr.airfm;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.AudioFocusRequest;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Binder;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class RadioPlaybackService extends Service {
              public static final String CHANNEL_ID = "air_fm_playback_channel";
              public static final String ACTION_TOGGLE = "com.sagarrawatssr.airfm.ACTION_TOGGLE";

              private MediaPlayer mediaPlayer;
              private PowerManager.WakeLock wakeLock;
              private AudioManager audioManager;
              private MediaSession mediaSession;
              private String currentTitle = "AIR FM Rainbow 102.6 MHz";
              private boolean isPlaying = false;

              private final IBinder binder = new LocalBinder();

              public interface PlaybackListener {
                  void onStateChanged(boolean playing);
              }
              private PlaybackListener listener;

              public class LocalBinder extends Binder {
                  public RadioPlaybackService getService() {
                      return RadioPlaybackService.this;
                  }
              }

              public void setListener(PlaybackListener l) {
                  this.listener = l;
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "airfm:lock");
                      wakeLock.acquire();
                  }

                  setupMediaSession();
                  setupNoAudioFocusLoss();
                  createNotificationChannel();
                  startForeground(101, buildNotification("Ready to Play", false));
              }

              private void setupMediaSession() {
                  mediaSession = new MediaSession(this, "AirFmSession");
                  mediaSession.setCallback(new MediaSession.Callback() {
                      @Override
                      public void onPlay() {
                          togglePlay();
                      }
                      @Override
                      public void onPause() {
                          togglePlay();
                      }
                  });
                  mediaSession.setActive(true);
              }

              private void setupNoAudioFocusLoss() {
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (audioManager != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      AudioAttributes attrs = new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build();

                      // Tell Android this stream should never pause or lower volume for other apps
                      AudioFocusRequest focusRequest = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                              .setAudioAttributes(attrs)
                              .setAcceptsDelayedFocusGain(false)
                              .setWillPauseWhenDucked(false)
                              .setOnAudioFocusChangeListener(focusChange -> {
                                  // IGNORE ALL FOCUS LOSS (VLC / Dual-sound behavior)
                              })
                              .build();
                      audioManager.requestAudioFocus(focusRequest);
                  }
              }

              public void playUrl(String streamUrl, String title) {
                  this.currentTitle = (title != null) ? title : "AIR FM Rainbow";
                  try {
                      if (mediaPlayer != null) {
                          mediaPlayer.reset();
                      } else {
                          mediaPlayer = new MediaPlayer();
                          mediaPlayer.setAudioAttributes(
                              new AudioAttributes.Builder()
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .build()
                          );
                      }
                      mediaPlayer.setDataSource(streamUrl);
                      mediaPlayer.prepareAsync();
                      mediaPlayer.setOnPreparedListener(mp -> {
                          mp.start();
                          isPlaying = true;
                          updateState();
                      });
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public void togglePlay() {
                  if (mediaPlayer != null) {
                      if (mediaPlayer.isPlaying()) {
                          mediaPlayer.pause();
                          isPlaying = false;
                      } else {
                          mediaPlayer.start();
                          isPlaying = true;
                      }
                      updateState();
                  }
              }

              public void seekRelative(int deltaMs) {
                  if (mediaPlayer != null) {
                      int target = Math.max(0, mediaPlayer.getCurrentPosition() + deltaMs);
                      mediaPlayer.seekTo(target);
                  }
              }

              private void updateState() {
                  updateNotification(currentTitle, isPlaying);
                  if (listener != null) {
                      listener.onStateChanged(isPlaying);
                  }
              }

              private void updateNotification(String text, boolean active) {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (nm != null) {
                      nm.notify(101, buildNotification(text, active));
                  }
              }

              private Notification buildNotification(String text, boolean active) {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent pOpen = PendingIntent.getActivity(
                          this, 0, openIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Intent toggleIntent = new Intent(this, RadioPlaybackService.class);
                  toggleIntent.setAction(ACTION_TOGGLE);
                  PendingIntent pToggle = PendingIntent.getService(
                          this, 1, toggleIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  int actionIcon = active ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play;
                  String actionTitle = active ? "Pause" : "Play";

                  Notification.Builder builder = new Notification.Builder(this, CHANNEL_ID)
                          .setContentTitle("AIR FM Rainbow (102.6 MHz)")
                          .setContentText(text)
                          .setSmallIcon(android.R.drawable.ic_lock_idle_charging)
                          .setContentIntent(pOpen)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .setOngoing(active)
                          .setStyle(new Notification.MediaStyle().setMediaSession(mediaSession.getSessionToken()))
                          .addAction(new Notification.Action.Builder(actionIcon, actionTitle, pToggle).build());

                  return builder.build();
              }

              private void createNotificationChannel() {
                  NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "AIR FM Live Radio",
                          NotificationManager.IMPORTANCE_LOW
                  );
                  channel.setDescription("Background playback and lock-screen controls");
                  channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (nm != null) {
                      nm.createNotificationChannel(channel);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_TOGGLE.equals(intent.getAction())) {
                      togglePlay();
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (mediaPlayer != null) {
                      mediaPlayer.release();
                  }
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  if (mediaSession != null) {
                      mediaSession.release();
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return binder;
              }
          }
          EOF

          # 6. MainActivity.java (Bridges Javascript to RadioPlaybackService)
          cat << 'EOF' > android_app/app/src/main/java/com/sagarrawatssr/airfm/MainActivity.java
          package com.sagarrawatssr.airfm;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private RadioPlaybackService radioService;
              private boolean isBound = false;

              private final ServiceConnection serviceConnection = new ServiceConnection() {
                  @Override
                  public void onServiceConnected(ComponentName name, IBinder binder) {
                      RadioPlaybackService.LocalBinder localBinder = (RadioPlaybackService.LocalBinder) binder;
                      radioService = localBinder.getService();
                      isBound = true;

                      radioService.setListener(playing -> {
                          runOnUiThread(() -> {
                              if (webView != null) {
                                  webView.evaluateJavascript("window.onNativeStateChanged && window.onNativeStateChanged(" + playing + ");", null);
                              }
                          });
                      });
                  }

                  @Override
                  public void onServiceDisconnected(ComponentName name) {
                      isBound = false;
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  Intent intent = new Intent(this, RadioPlaybackService.class);
                  startForegroundService(intent);
                  bindService(intent, serviceConnection, Context.BIND_AUTO_CREATE);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void play(String url, String title) {
                          runOnUiThread(() -> {
                              if (isBound && radioService != null) {
                                  radioService.playUrl(url, title);
                              }
                          });
                      }

                      @JavascriptInterface
                      public void toggle() {
                          runOnUiThread(() -> {
                              if (isBound && radioService != null) {
                                  radioService.togglePlay();
                              }
                          });
                      }

                      @JavascriptInterface
                      public void seekRelative(int deltaMs) {
                          runOnUiThread(() -> {
                              if (isBound && radioService != null) {
                                  radioService.seekRelative(deltaMs);
                              }
                          });
                      }
                  }, "AndroidAudio");

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (isBound) {
                      unbindService(serviceConnection);
                      isBound = false;
                  }
                  if (webView != null) {
                      webView.destroy();
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.4 Wrapper
        run: |
          cd android_app
          gradle wrapper --gradle-version 8.4

      - name: Build Standalone Debug APK
        run: |
          cd android_app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-FM-Rainbow-VLC-Style-APK
          path: android_app/app/build/outputs/apk/debug/*.apk
