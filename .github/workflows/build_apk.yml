name: Build Dual Audio Radio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build App Project
        run: |
          mkdir -p native_app/app/src/main/java/com/sagar/airfm
          mkdir -p native_app/app/src/main/res/layout
          mkdir -p native_app/app/src/main/res/values

          # Fixed: File created directly in project root
          cat << 'EOF' > native_app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # Root build.gradle
          cat << 'EOF' > native_app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          echo "include ':app'" > native_app/settings.gradle

          # App build.gradle
          cat << 'EOF' > native_app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sagar.airfm'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sagar.airfm"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.core:core:1.12.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > native_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="AIR FM Rainbow"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RadioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # UI Layout
          cat << 'EOF' > native_app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical"
              android:background="#121212">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="AIR FM Rainbow 102.6"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:textStyle="bold" />
              <Button
                  android:id="@+id/btnPlay"
                  android:layout_width="200dp"
                  android:layout_height="60dp"
                  android:layout_marginTop="30dp"
                  android:text="Play / Pause"
                  android:textSize="18sp" />
          </LinearLayout>
          EOF

          # Service with ExoPlayer (No Audio Focus = Dual Audio with YouTube)
          cat << 'EOF' > native_app/app/src/main/java/com/sagar/airfm/RadioService.java
          package com.sagar.airfm;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Binder;
          import android.os.Build;
          import android.os.IBinder;
          import androidx.core.app.NotificationCompat;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;

          public class RadioService extends Service {
              private ExoPlayer player;
              private final IBinder binder = new LocalBinder();
              private static final String STREAM = "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8";

              public class LocalBinder extends Binder {
                  public RadioService getService() { return RadioService.this; }
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannel();

                  // Set up native player without internal focus takeover
                  player = new ExoPlayer.Builder(this).build();
                  MediaItem item = MediaItem.fromUri(STREAM);
                  player.setMediaItem(item);
                  player.prepare();

                  startForeground(1, getNotification("Ready to play"));
              }

              public void toggle() {
                  if (player.isPlaying()) {
                      player.pause();
                      updateNotif("Paused");
                  } else {
                      player.play();
                      updateNotif("Playing (Dual Audio Active)");
                  }
              }

              private void updateNotif(String text) {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (nm != null) nm.notify(1, getNotification(text));
              }

              private Notification getNotification(String text) {
                  Intent intent = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, intent, PendingIntent.FLAG_IMMUTABLE);
                  return new NotificationCompat.Builder(this, "radio")
                          .setContentTitle("AIR FM Rainbow")
                          .setContentText(text)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentIntent(pi)
                          .setOngoing(player != null && player.isPlaying())
                          .build();
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel("radio", "Radio", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) { return START_STICKY; }

              @Override
              public void onDestroy() {
                  if (player != null) player.release();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return binder; }
          }
          EOF

          # MainActivity.java
          cat << 'EOF' > native_app/app/src/main/java/com/sagar/airfm/MainActivity.java
          package com.sagar.airfm;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ServiceConnection;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.widget.Button;

          public class MainActivity extends Activity {
              private RadioService service;
              private boolean bound = false;

              private final ServiceConnection conn = new ServiceConnection() {
                  @Override
                  public void onServiceConnected(ComponentName name, IBinder b) {
                      service = ((RadioService.LocalBinder) b).getService();
                      bound = true;
                  }
                  @Override
                  public void onServiceDisconnected(ComponentName name) { bound = false; }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                      }
                  }

                  Intent intent = new Intent(this, RadioService.class);
                  startForegroundService(intent);
                  bindService(intent, conn, Context.BIND_AUTO_CREATE);

                  Button btn = findViewById(R.id.btnPlay);
                  btn.setOnClickListener(v -> {
                      if (bound && service != null) service.toggle();
                  });
              }

              @Override
              protected void onDestroy() {
                  if (bound) unbindService(conn);
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: |
          cd native_app
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dual-Audio-AIR-FM-APK
          path: native_app/app/build/outputs/apk/debug/*.apk
