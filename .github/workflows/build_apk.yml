name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_twa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build APK (Non-Interactive)
        env:
          JAVA_HOME: /usr/lib/jvm/zulu-17-amd64
        run: |
          mkdir -p build_dir && cd build_dir
          
          # Run init non-interactively using 'yes' pipe
          yes "" | bubblewrap init --manifest="https://sagarrawatssr.github.io/air-fm-recorder/manifest.json" --skipPwaValidation
          
          # Build signed/debug APK non-interactively
          yes "" | bubblewrap build || bubblewrap build --skipSigning

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-FM-Rainbow-APK
          path: build_dir/*.apk
