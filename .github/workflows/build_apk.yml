name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pre-configure Bubblewrap & Build APK
        run: |
          npm install -g @bubblewrap/cli

          # 1. Bubblewrap looks for configuration in ~/.bubblewrap/config.json
          # GitHub Actions runners already have Java and Android SDK installed here:
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          mkdir -p app_build && cd app_build

          # 2. Automatically generate twa-manifest.json from your live PWA manifest
          npx @bubblewrap/cli init \
            --manifest="https://sagarrawatssr.github.io/air-fm-recorder/manifest.json" \
            --skipPwaValidation \
            --chromeOSOnly=false

          # 3. Build unsigned/debug APK without blocking for keystore inputs
          npx @bubblewrap/cli build --skipSigning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-FM-Rainbow-APK
          path: app_build/*.apk
