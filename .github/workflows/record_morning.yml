name: "1. Record FM Rainbow (07 AM - 01 PM)"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  record_morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg gh

      - name: Record & Save by Dominant Slot Time
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          STREAM_URL="https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8"

          for i in $(seq -w 0 5); do
          
            TMP_FILE="output/temp_rec_${i}.mp3"
            CURRENT_HOUR="$(TZ='Asia/Kolkata' date +'%-H')"
            if [ "$CURRENT_HOUR" -ge 19 ]; then
              echo "Clock reached 7:00 PM IST ($CURRENT_HOUR:00). Halting afternoon recorder."
              break
            fi

            # 2. Calculate seconds remaining until :54 of this hour (or next hour if already past :54)
            MIN="$(TZ='Asia/Kolkata' date +'%-M')"
            SEC="$(TZ='Asia/Kolkata' date +'%-S')"
            TARGET_MIN=54

            if [ "$MIN" -lt "$TARGET_MIN" ]; then
              # Target is in the current hour
              RECORD_SECONDS=$(( (TARGET_MIN - MIN) * 60 - SEC ))
            else
              # Already past :54; record until :54 of the NEXT hour
              RECORD_SECONDS=$(( (60 - MIN + TARGET_MIN) * 60 - SEC ))
            fi

            # Guard rail: ensure we record at least 60 seconds
            if [ "$RECORD_SECONDS" -lt 60 ]; then
              RECORD_SECONDS=3600
            fi
            
            echo "--- Recording hour chunk $i for 3600 seconds ---"
            ffmpeg -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -fflags +nobuffer+flush_packets \
              -live_start_index -1 \
              -i "$STREAM_URL" \
              -t RECORD_SECONDS \
              -c:a libmp3lame -b:a 64k -ac 1 \
              "$TMP_FILE"

            # Determine IST date and the dominant hour via recording midpoint (~30 mins ago)
            REC_DATE="$(TZ='Asia/Kolkata' date -d '30 minutes ago' +'%Y-%m-%d')"
            MID_HOUR="$(TZ='Asia/Kolkata' date -d '30 minutes ago' +'%-H')"
            DATE_TAG="archive-${REC_DATE}"

            # Map IST 24-hr clock (7 to 12) to slot suffix (00 to 05)
            case "$MID_HOUR" in
              7)  SLOT="00" ;;
              8)  SLOT="01" ;;
              9)  SLOT="02" ;;
              10) SLOT="03" ;;
              11) SLOT="04" ;;
              12) SLOT="05" ;;
              *)  SLOT="$i" ;; # fallback to loop index if triggered outside normal morning window
            esac

            TARGET_FILE="${REC_DATE}_hour_${SLOT}.mp3"
            mv "$TMP_FILE" "output/$TARGET_FILE"
            echo "Audio midpoint fell in hour $MID_HOUR IST. Saved as: $TARGET_FILE"

            # Ensure release container exists and upload immediately
            gh release view "$DATE_TAG" || gh release create "$DATE_TAG" --title "Radio Archive ${REC_DATE}" --notes "Recordings for ${REC_DATE}"
            gh release upload "$DATE_TAG" "output/$TARGET_FILE" --clobber
            echo "Uploaded $TARGET_FILE successfully!"
          done

          echo "Purging recordings older than 30 days..."
          EXPIRED_TAG="archive-$(TZ='Asia/Kolkata' date -d '31 days ago' +'%Y-%m-%d')"
          gh release delete "$EXPIRED_TAG" --yes --cleanup-tag || true

          # Sunday check to push keepalive commit and prevent 60-day repository dormancy
          DAY_OF_WEEK="$(TZ='Asia/Kolkata' date +'%u')"
          if [ "$DAY_OF_WEEK" -eq 7 ]; then
            echo "Sunday detected: Pushing keepalive commit..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: weekly keepalive ping $(date +'%Y-%m-%d')"
            git push origin main
            echo "Keepalive commit pushed successfully."
          else
            echo "Not Sunday; skipping keepalive."
          fi
