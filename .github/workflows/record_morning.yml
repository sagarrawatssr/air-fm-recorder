name: "1. Record FM Rainbow (07 AM - 01 PM)"

on:
  schedule:
    # 7:00 AM IST is 01:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record_morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg gh

      - name: Record and Upload Hourly (Hours 00 to 05)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          DATE_TAG="archive-$(TZ='Asia/Kolkata' date +'%Y-%m-%d')"
          STREAM_URL="https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8"

          # Ensure today's release exists
          gh release view "$DATE_TAG" || gh release create "$DATE_TAG" --title "Radio Archive $(TZ='Asia/Kolkata' date +'%Y-%m-%d')" --notes "Daily 1-hour slices"

          # Loop through hours 00 to 05 (7 AM to 1 PM)
          for i in $(seq -w 0 5); do
            FILE_NAME="hour_${i}.mp3"
            echo "----------------------------------------"
            echo "Recording Morning Slot ${i} (Hour $((10#$i + 1)) of 12)..."
            echo "----------------------------------------"
            
            ffmpeg -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -i "$STREAM_URL" \
              -t 3600 \
              -c:a libmp3lame -b:a 64k -ac 1 \
              "output/$FILE_NAME"

            echo "Slot ${i} complete. Uploading immediately to GitHub..."
            gh release upload "$DATE_TAG" "output/$FILE_NAME" --clobber
            echo "Morning slot ${i} uploaded successfully!"
          done

          echo "Purging recordings older than 30 days..."
          EXPIRED_TAG="archive-$(TZ='Asia/Kolkata' date -d '31 days ago' +'%Y-%m-%d')"
          gh release delete "$EXPIRED_TAG" --yes --cleanup-tag || true
