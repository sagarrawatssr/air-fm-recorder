name: "1. Record FM Rainbow (07 AM - 01 PM)"

on:
  schedule:
    # 7:00 AM IST is 01:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record_morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Record 6 Hours (07:00 AM - 01:00 PM)
        run: |
          mkdir -p output
          DATE_STR=$(date +'%Y-%m-%d')
          STREAM_URL="https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8"
          
          # Records for 21600 seconds (6h), sliced into 3600-second (1h) segments
          ffmpeg -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$STREAM_URL" \
            -t 21600 \
            -c:a libmp3lame -b:a 64k -ac 1 \
            -f segment -segment_time 3600 -segment_start_number 0 -reset_timestamps 1 \
            "output/${DATE_STR}_hour_%02d.mp3"

      - name: Publish Morning Audio Slices
        uses: softprops/action-gh-release@v2
        with:
          tag_name: archive-morning-${{ github.run_id }}
          files: output/*.mp3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
