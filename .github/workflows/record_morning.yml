name: "1. Record FM Rainbow (07 AM - 01 PM)"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  record_morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg gh

      - name: Record, Tag & Maintain Morning Broadcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          STREAM_URL="https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8"

          for i in $(seq -w 0 5); do
            # NEW CODE: Halts if it's 18:54 or later to prevent recording past 7:00 PM
            CURRENT_HOUR="$(TZ='Asia/Kolkata' date +'%-H')"
            CURRENT_MIN="$(TZ='Asia/Kolkata' date +'%-M')"
            if [ "$CURRENT_HOUR" -gt 12 ] || { [ "$CURRENT_HOUR" -eq 12 ] && [ "$CURRENT_MIN" -ge 54 ]; }; then
               echo "Clock reached 12:54 PM IST cutoff ($CURRENT_HOUR:$CURRENT_MIN). Halting afternoon recorder."
               break
            fi
            

            # Calculate seconds remaining until :54 mark
            MIN="$(TZ='Asia/Kolkata' date +'%-M')"
            SEC="$(TZ='Asia/Kolkata' date +'%-S')"
            TARGET_MIN=54
            REMAINING_SECS=$(( (TARGET_MIN - MIN) * 60 - SEC ))

            if [ "$MIN" -lt "$TARGET_MIN" ]&& [ "$REMAINING_SECS" -ge 1800 ]; then
              RECORD_SECONDS=$(( (TARGET_MIN - MIN) * 60 - SEC ))
            else
              RECORD_SECONDS=$(( (60 - MIN + TARGET_MIN) * 60 - SEC ))
            fi

  

            TMP_FILE="output/temp_rec_${i}.mp3"

            echo "--- Recording hour chunk $i for $RECORD_SECONDS seconds ($(( RECORD_SECONDS / 60 )) min $(( RECORD_SECONDS % 60 )) sec) ---"
            ffmpeg -nostdin -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 10 \
              -rw_timeout 15000000 \
              -fflags +nobuffer+flush_packets \
              -live_start_index -1 \
              -i "$STREAM_URL" \
              -t "$RECORD_SECONDS" \
              -c:a libmp3lame -b:a 64k -ac 1 \
              "$TMP_FILE" || true

            # Verify file exists and is not just a tiny fragment (at least 14.5 MB)
            FILE_SIZE=$(stat -c%s "$TMP_FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -lt 14000000 ]; then
              echo "Warning: File size is too small (${FILE_SIZE} bytes). Stream drop or recording failure; skipping upload."
              rm -f "$TMP_FILE"
              continue
            fi

            # Dynamic midpoint based on actual recorded seconds
            MIDPOINT_AGO=$(( RECORD_SECONDS / 2 ))
            REC_DATE="$(TZ='Asia/Kolkata' date -d "$MIDPOINT_AGO seconds ago" +'%Y-%m-%d')"
            MID_HOUR="$(TZ='Asia/Kolkata' date -d "$MIDPOINT_AGO seconds ago" +'%-H')"
            DATE_TAG="archive-${REC_DATE}"

            # Map IST 24-hr clock (7 to 12) to slot suffix (00 to 05)
            case "$MID_HOUR" in
              7)  SLOT="00" ;;
              8)  SLOT="01" ;;
              9)  SLOT="02" ;;
              10) SLOT="03" ;;
              11) SLOT="04" ;;
              12) SLOT="05" ;;
              *)  SLOT="$i" ;; # fallback to loop index if outside standard slots
            esac

            TARGET_FILE="${REC_DATE}_hour_${SLOT}.mp3"
            mv "$TMP_FILE" "output/$TARGET_FILE"
            echo "Audio midpoint fell in hour $MID_HOUR IST. Saved as: $TARGET_FILE"

            gh release view "$DATE_TAG" || gh release create "$DATE_TAG" --title "Radio Archive ${REC_DATE}" --notes "Recordings for ${REC_DATE}"
            gh release upload "$DATE_TAG" "output/$TARGET_FILE" --clobber
            echo "Uploaded $TARGET_FILE successfully!"
          done

          echo "Purging archives older than 30 days..."
          EXPIRED_TAG="archive-$(TZ='Asia/Kolkata' date -d '31 days ago' +'%Y-%m-%d')"
          gh release delete "$EXPIRED_TAG" --yes --cleanup-tag || true
