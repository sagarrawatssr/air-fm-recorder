<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIR FM Rainbow Player</title>
  
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">

  <!-- HLS.js for Live Stream -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #e50914;
      --text: #ffffff;
      --sub: #9e9e9e;
      --btn-bg: #2d2d2d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .live-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .status-text {
      font-size: 0.82rem;
      color: var(--sub);
      margin-bottom: 16px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--btn-bg);
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .btn-primary {
      background: var(--accent);
    }

    audio {
      width: 100%;
      margin-top: 4px;
    }

    .date-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--btn-bg);
      color: #fff;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      font-size: 0.9rem;
      margin: 12px 0;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .slot-btn {
      background: var(--btn-bg);
      color: #d1d5db;
      font-size: 0.8rem;
      padding: 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .slot-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Player Card -->
    <div class="card">
      <div class="title-row">
        <h1>AIR FM Rainbow</h1>
        <span class="live-dot" id="live-indicator"></span>
      </div>
      <p class="status-text" id="status">Live Broadcast</p>

      <div class="btn-row">
        <button id="btn-toggle" class="btn-primary" onclick="togglePlay()">Play</button>
        <button onclick="switchToLiveEdge()">Go to Live Edge</button>
      </div>

      <audio id="audio-player" controls preload="none"></audio>
    </div>

    <!-- Archive Card -->
    <div class="card">
      <h2 style="font-size: 1rem; font-weight: 600;">Recorded Archives</h2>
      <input type="date" id="archive-date" class="date-input" onchange="renderSlots()">
      <div class="grid" id="slot-container"></div>
    </div>
  </div>

  <script>
    const STREAM_URL = "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8";
    const GITHUB_BASE = "https://github.com/sagarrawatssr/air-fm-recorder/releases/download";

    const audio = document.getElementById("audio-player");
    const statusText = document.getElementById("status");
    const btnToggle = document.getElementById("btn-toggle");
    const liveDot = document.getElementById("live-indicator");

    let hls = null;
    let isLive = true;
    let userPlaying = false;

    const SLOTS = [
      { id: "00", label: "07 AM - 08 AM" },
      { id: "01", label: "08 AM - 09 AM" },
      { id: "02", label: "09 AM - 10 AM" },
      { id: "03", label: "10 AM - 11 AM" },
      { id: "04", label: "11 AM - 12 PM" },
      { id: "05", label: "12 PM - 01 PM" },
      { id: "06", label: "01 PM - 02 PM" },
      { id: "07", label: "02 PM - 03 PM" },
      { id: "08", label: "03 PM - 04 PM" },
      { id: "09", label: "04 PM - 05 PM" },
      { id: "10", label: "05 PM - 06 PM" },
      { id: "11", label: "06 PM - 07 PM" }
    ];

    // Initialize HLS directly to the native audio element (No Web Audio API = Crystal Clear Audio)
    function setupHls() {
      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({
          liveSyncDurationCount: 1,
          liveMaxLatencyDurationCount: 2,
          enableWorker: true
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(audio);

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                setupHls();
                break;
            }
          }
        });
      } else if (audio.canPlayType("application/vnd.apple.mpegurl")) {
        audio.src = STREAM_URL;
      }
    }

    // Auto-Resume on Interruption
    audio.addEventListener("pause", () => {
      btnToggle.textContent = "Play";
      if (userPlaying) {
        // Interrupted by an external notification/sound; auto-resume
        setTimeout(() => {
          if (userPlaying && audio.paused) {
            if (isLive) {
              switchToLiveEdge();
            } else {
              audio.play().catch(() => {});
            }
          }
        }, 1000);
      }
    });

    audio.addEventListener("play", () => {
      btnToggle.textContent = "Pause";
      userPlaying = true;
    });

    // Enforce Live Edge
    function switchToLiveEdge() {
      isLive = true;
      userPlaying = true;
      statusText.textContent = "Connecting to Live Edge...";
      liveDot.style.background = "var(--accent)";

      document.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("active"));

      if (hls) {
        hls.stopLoad();
        hls.loadSource(STREAM_URL + "?ts=" + Date.now());
        hls.startLoad(-1);
        audio.play().then(() => {
          statusText.textContent = "Live Broadcast";
        }).catch(() => {});
      } else {
        audio.src = STREAM_URL + "?ts=" + Date.now();
        audio.currentTime = 0;
        audio.play().then(() => {
          statusText.textContent = "Live Broadcast";
        }).catch(() => {});
      }
    }

    function togglePlay() {
      if (audio.paused) {
        userPlaying = true;
        if (isLive) {
          switchToLiveEdge();
        } else {
          audio.play();
        }
      } else {
        userPlaying = false;
        audio.pause();
      }
    }

    // Slot Playback
    function playSlot(slotId, btn) {
      isLive = false;
      userPlaying = true;

      if (hls) {
        hls.destroy();
        hls = null;
      }

      document.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      liveDot.style.background = "#555";

      const date = document.getElementById("archive-date").value;
      const fileUrl = `${GITHUB_BASE}/archive-${date}/${date}_hour_${slotId}.mp3`;

      statusText.textContent = `Archive: ${date} (${slotId})`;
      audio.src = fileUrl;
      audio.load();
      audio.play().catch(() => {
        alert("Audio for this slot was not found or is still recording.");
        statusText.textContent = "Slot unavailable";
      });
    }

    function renderSlots() {
      const container = document.getElementById("slot-container");
      container.innerHTML = "";
      SLOTS.forEach(slot => {
        const btn = document.createElement("button");
        btn.className = "slot-btn";
        btn.textContent = slot.label;
        btn.onclick = () => playSlot(slot.id, btn);
        container.appendChild(btn);
      });
    }

    // Default to today IST
    document.getElementById("archive-date").value = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
    renderSlots();
    setupHls();
  </script>
</body>
</html>
