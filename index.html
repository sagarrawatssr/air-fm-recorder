<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIR Rainbow 12-Hour Sweeper Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #238636;
      --accent-hover: #2ea043;
      --blue: #2f81f7;
      --text: #c9d1d9;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .app-container { max-width: 900px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    
    header { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; }
    h1 { color: #f0f6fc; font-size: 1.5rem; margin-bottom: 6px; }
    p.sub { font-size: 0.9rem; color: #8b949e; }
    
    .player-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; background: #21262d; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; }
    .status-badge.live { background: #f8514933; color: #ff7b72; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    
    audio { width: 100%; margin-top: 15px; }

    /* Sweeper Timeline Grid */
    .section-title { font-size: 1.1rem; color: #f0f6fc; margin: 20px 0 10px; font-weight: 600; }
    .sweeper-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .slot-btn {
      background: #21262d; border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 10px; color: var(--text); cursor: pointer; text-align: center;
      transition: all 0.2s ease;
    }
    .slot-btn:hover { background: #30363d; border-color: var(--blue); }
    .slot-btn.active { background: var(--blue); color: #fff; font-weight: bold; border-color: #58a6ff; }
    .slot-btn span.hour-label { font-size: 0.9rem; display: block; }
    .slot-btn span.tag { font-size: 0.7rem; opacity: 0.7; }

    .stream-inputs { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    input[type="text"] {
      flex: 1; min-width: 250px; background: #0d1117; border: 1px solid var(--border);
      padding: 10px; border-radius: 6px; color: #fff;
    }
    button.btn {
      background: var(--accent); color: #fff; border: none; padding: 10px 18px;
      border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    button.btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>AIR FM Rainbow Player & 12h Sweeper</h1>
    <p class="sub">Continuous cloud recording from 07:00 AM to 07:00 PM broken down into 1-hour sweepable segments.</p>
  </header>

  <!-- Player Box -->
  <div class="player-card">
    <div id="statusBadge" class="status-badge live">
      <div class="dot"></div> Playing Live Feed: AIR Rainbow (Delhi/Mumbai)
    </div>
    <h2 id="nowPlayingTitle" style="font-size: 1.2rem; color: #fff;">AIR FM Rainbow 102.6 Live</h2>
    <audio id="audioElement" controls autoplay></audio>
    
    <div style="display:flex; gap:10px; margin-top:15px;">
      <button class="btn" style="background:#21262d; border: 1px solid var(--border);" onclick="playLive()">Switch to Live Radio</button>
      <button class="btn" style="background:#21262d; border: 1px solid var(--border);" onclick="nextHour()">Sweep to Next Hour &rarr;</button>
    </div>
  </div>

  <!-- Sweep Slices (7 AM - 7 PM) -->
  <div>
    <div class="section-title">Hourly Playback Sweeper (07:00 AM &ndash; 07:00 PM)</div>
    <div class="sweeper-grid" id="sweeperGrid">
      <!-- 12 Hours generated by JS -->
    </div>
  </div>

  <!-- Custom Stream Adder -->
  <div class="player-card">
    <div class="section-title" style="margin-top:0;">Add Another Station / Stream URL</div>
    <div class="stream-inputs">
      <input type="text" id="customName" placeholder="Station Name (e.g. Vividh Bharati)">
      <input type="text" id="customUrl" placeholder="Stream Link (.m3u8, .aac, .mp3)">
      <button class="btn" onclick="addCustomStation()">Play & Add</button>
    </div>
  </div>
</div>

<script>
  const LIVE_URL = "https://air.pc.cdn.bitgravity.com/air/live/pbaudio001/playlist.m3u8";
  const audio = document.getElementById("audioElement");
  const nowPlayingTitle = document.getElementById("nowPlayingTitle");
  const statusBadge = document.getElementById("statusBadge");
  let hlsInstance = null;
  let currentHourIdx = -1;

  // 12 One-Hour Blocks (7am-7pm)
  const hours = [
    { label: "07 - 08 AM", file: "hour_00.mp3" },
    { label: "08 - 09 AM", file: "hour_01.mp3" },
    { label: "09 - 10 AM", file: "hour_02.mp3" },
    { label: "10 - 11 AM", file: "hour_03.mp3" },
    { label: "11 - 12 PM", file: "hour_04.mp3" },
    { label: "12 - 01 PM", file: "hour_05.mp3" },
    { label: "01 - 02 PM", file: "hour_06.mp3" },
    { label: "02 - 03 PM", file: "hour_07.mp3" },
    { label: "03 - 04 PM", file: "hour_08.mp3" },
    { label: "04 - 05 PM", file: "hour_09.mp3" },
    { label: "05 - 06 PM", file: "hour_10.mp3" },
    { label: "06 - 07 PM", file: "hour_11.mp3" }
  ];

  // Render buttons
  const grid = document.getElementById("sweeperGrid");
  hours.forEach((h, index) => {
    const btn = document.createElement("button");
    btn.className = "slot-btn";
    btn.id = "slot-" + index;
    btn.innerHTML = `<span class="hour-label">${h.label}</span><span class="tag">Hour ${index+1}</span>`;
    btn.onclick = () => playSegment(index);
    grid.appendChild(btn);
  });

  function playLive() {
    currentHourIdx = -1;
    clearActive();
    statusBadge.className = "status-badge live";
    statusBadge.innerHTML = `<div class="dot"></div> Playing Live Feed`;
    nowPlayingTitle.innerText = "AIR FM Rainbow 102.6 Live";
    loadSource(LIVE_URL);
  }

  function playSegment(index) {
    currentHourIdx = index;
    clearActive();
    document.getElementById("slot-" + index).classList.add("active");
    statusBadge.className = "status-badge";
    statusBadge.innerHTML = `<div class="dot" style="background:#2f81f7;"></div> Recording Playback`;
    nowPlayingTitle.innerText = `AIR Rainbow Segment: ${hours[index].label}`;

    // Point this to your backend cloud folder / GitHub release assets
    const fileUrl = `./recordings/${hours[index].file}`;
    loadSource(fileUrl);
  }

  // Auto-sweep to next hour when current segment ends
  audio.addEventListener("ended", () => {
    if (currentHourIdx >= 0 && currentHourIdx < hours.length - 1) {
      playSegment(currentHourIdx + 1);
    }
  });

  function nextHour() {
    if (currentHourIdx < hours.length - 1) {
      playSegment(currentHourIdx + 1);
    } else {
      playSegment(0);
    }
  }

  function clearActive() {
    document.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("active"));
  }

  function loadSource(url) {
    if (url.endsWith(".m3u8") && Hls.isSupported()) {
      if (hlsInstance) hlsInstance.destroy();
      hlsInstance = new Hls();
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(audio);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(() => {}));
    } else {
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      audio.src = url;
      audio.play().catch(() => {});
    }
  }

  function addCustomStation() {
    const name = document.getElementById("customName").value.trim();
    const url = document.getElementById("customUrl").value.trim();
    if (!url) return alert("Please enter a valid stream link!");
    nowPlayingTitle.innerText = name || "Custom Station";
    statusBadge.className = "status-badge live";
    statusBadge.innerHTML = `<div class="dot"></div> Custom Live Stream`;
    loadSource(url);
  }

  // Auto-start live stream on page open
  playLive();
</script>
</body>
</html>
