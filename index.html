<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AIR FM Rainbow 102.6 Live & Archive</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #151d28;
      --card-active: #1d2838;
      --blue: #2f81f7;
      --blue-glow: rgba(47, 129, 247, 0.25);
      --live-red: #ff3b30;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: #212c3d;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 20px;
    }

    /* Header */
    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .brand p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Player Card */
    .player-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .player-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* YouTube Style Live Badge */
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      background: #1e2633;
      border: 1px solid var(--border);
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .live-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .live-pill.active {
      background: rgba(255, 59, 48, 0.15);
      border-color: rgba(255, 59, 48, 0.5);
      color: var(--live-red);
    }

    .live-pill.active .dot {
      background: var(--live-red);
      box-shadow: 0 0 8px var(--live-red);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .track-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    audio {
      width: 100%;
      height: 44px;
      border-radius: 8px;
      outline: none;
    }

    /* Mobile-Action Buttons */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      min-height: 44px;
      background: #1c2534;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:active {
      background: #253347;
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    /* Date Bar (Compact Mobile Style) */
    .date-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .step-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #1c2534;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .step-btn:active {
      background: #253347;
    }

    input[type="date"] {
      flex: 1;
      height: 42px;
      background: #0f1520;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      padding: 0 10px;
      outline: none;
      -webkit-appearance: none;
    }

    /* Hourly Timeline (Horizontal Swipe Carousel for Mobile) */
    .timeline-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding-left: 4px;
    }

    .timeline-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .timeline-scroll::-webkit-scrollbar {
      display: none;
    }

    .slot-card {
      flex: 0 0 100px;
      height: 68px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .slot-card:active {
      transform: scale(0.96);
    }

    .slot-card.active {
      background: var(--blue);
      border-color: #58a6ff;
      box-shadow: 0 4px 14px var(--blue-glow);
    }

    .slot-card .slot-hour {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
    }

    .slot-card .slot-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .slot-card.active .slot-sub {
      color: #dbeafe;
    }

    /* Error Toast */
    .error-card {
      display: none;
      background: rgba(255, 59, 48, 0.1);
      border: 1px solid rgba(255, 59, 48, 0.35);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.82rem;
      color: #ff7b72;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header>
    <div class="brand">
      <h1>AIR FM Rainbow 102.6</h1>
      <p>Delhi Live &amp; 30-Day Hourly Archive</p>
    </div>
  </header>

  <!-- Player Box -->
  <div class="player-card">
    <div class="player-meta">
      <!-- YouTube-style Live Pill -->
      <button id="liveBtn" class="live-pill active" onclick="playLive()">
        <span class="dot"></span> LIVE
      </button>
      <span id="badgeStatus" style="font-size: 0.75rem; color: var(--text-muted);">Delhi Feed</span>
    </div>

    <div>
      <div id="trackTitle" class="track-title">AIR FM Rainbow Delhi</div>
      <div id="trackSub" class="track-sub">Real-time broadcast</div>
    </div>

    <audio id="audioElem" controls playsinline></audio>

    <div id="errorCard" class="error-card">
      Audio not found for this hour &amp; date. It may still be recording or expired.
    </div>

    <div class="controls-grid">
      <button id="sweepBtn" class="btn" onclick="sweepNext()" disabled>
        Sweep Next &rarr;
      </button>
      <button class="btn" onclick="playLive()">
        Sync Live
      </button>
    </div>
  </div>

  <!-- Mobile Date Stepper -->
  <div class="date-bar">
    <button class="step-btn" onclick="stepDay(-1)" title="Previous Day">&#8249;</button>
    <input type="date" id="datePicker" onchange="onDateChange()">
    <button class="step-btn" onclick="stepDay(1)" title="Next Day">&#8250;</button>
  </div>

  <!-- Horizontal Swipeable Timeline (Hours 07 AM - 07 PM) -->
  <div class="timeline-section">
    <div class="section-title">Hourly Slices (Swipe to Browse)</div>
    <div class="timeline-scroll" id="slotsTrack">
      <!-- Populated via JS -->
    </div>
  </div>
</div>

<script>
  const STREAM_URL = "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8";
  const REPO_OWNER = "sagarrawatssr";
  const REPO_NAME = "air-fm-recorder";

  const audio = document.getElementById("audioElem");
  const liveBtn = document.getElementById("liveBtn");
  const trackTitle = document.getElementById("trackTitle");
  const trackSub = document.getElementById("trackSub");
  const sweepBtn = document.getElementById("sweepBtn");
  const errorCard = document.getElementById("errorCard");
  const datePicker = document.getElementById("datePicker");
  const slotsTrack = document.getElementById("slotsTrack");

  let hls = null;
  let activeIndex = -1; // -1 represents LIVE

  // Calendar bounds: 30 days rolling
  const now = new Date();
  const past30 = new Date();
  past30.setDate(now.getDate() - 30);

  const toYMD = (d) => d.toISOString().split('T')[0];
  datePicker.max = toYMD(now);
  datePicker.min = toYMD(past30);
  datePicker.value = toYMD(now);

  const hourBlocks = [
    { label: "07 - 08 AM", file: "hour_00.mp3" },
    { label: "08 - 09 AM", file: "hour_01.mp3" },
    { label: "09 - 10 AM", file: "hour_02.mp3" },
    { label: "10 - 11 AM", file: "hour_03.mp3" },
    { label: "11 - 12 PM", file: "hour_04.mp3" },
    { label: "12 - 01 PM", file: "hour_05.mp3" },
    { label: "01 - 02 PM", file: "hour_06.mp3" },
    { label: "02 - 03 PM", file: "hour_07.mp3" },
    { label: "03 - 04 PM", file: "hour_08.mp3" },
    { label: "04 - 05 PM", file: "hour_09.mp3" },
    { label: "05 - 06 PM", file: "hour_10.mp3" },
    { label: "06 - 07 PM", file: "hour_11.mp3" }
  ];

  // Render Horizontal Cards
  hourBlocks.forEach((slot, idx) => {
    const card = document.createElement("div");
    card.className = "slot-card";
    card.id = "card-" + idx;
    card.innerHTML = `
      <span class="slot-hour">${slot.label}</span>
      <span class="slot-sub">Hour ${idx + 1}</span>
    `;
    card.onclick = () => playArchive(idx);
    slotsTrack.appendChild(card);
  });

  function playLive() {
    activeIndex = -1;
    clearHighlights();
    errorCard.style.display = "none";

    liveBtn.classList.add("active");
    trackTitle.innerText = "AIR FM Rainbow Delhi";
    trackSub.innerText = "Real-time broadcast";
    sweepBtn.disabled = true;

    loadSource(STREAM_URL + "?ts=" + Date.now(), true);
  }

  function playArchive(index) {
    activeIndex = index;
    clearHighlights();
    errorCard.style.display = "none";

    const card = document.getElementById("card-" + index);
    if (card) {
      card.classList.add("active");
      // Auto-scroll timeline to keep active hour in mobile view
      card.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }

    liveBtn.classList.remove("active");
    const chosenDate = datePicker.value;
    trackTitle.innerText = `AIR Rainbow: ${hourBlocks[index].label}`;
    trackSub.innerText = `Archive: ${chosenDate}`;
    sweepBtn.disabled = false;

    const fileUrl = `https://github.com/${REPO_OWNER}/${REPO_NAME}/releases/download/archive-${chosenDate}/${hourBlocks[index].file}`;
    loadSource(fileUrl, false);
  }

  function sweepNext() {
    if (activeIndex >= 0 && activeIndex < hourBlocks.length - 1) {
      playArchive(activeIndex + 1);
    } else if (activeIndex === hourBlocks.length - 1) {
      alert("Reached the last 6-7 PM slot for this day.");
    }
  }

  function onDateChange() {
    if (activeIndex >= 0) playArchive(activeIndex);
  }

  function stepDay(offset) {
    const cur = new Date(datePicker.value);
    cur.setDate(cur.getDate() + offset);
    if (cur >= past30 && cur <= now) {
      datePicker.value = toYMD(cur);
      onDateChange();
    }
  }

  // Auto sweep when audio ends
  audio.addEventListener("ended", () => {
    if (activeIndex >= 0 && activeIndex < hourBlocks.length - 1) {
      playArchive(activeIndex + 1);
    }
  });

  // Handle missing audio gracefully
  audio.addEventListener("error", () => {
    if (activeIndex >= 0) {
      errorCard.style.display = "block";
    }
  });

  function clearHighlights() {
    document.querySelectorAll(".slot-card").forEach(c => c.classList.remove("active"));
  }

  function loadSource(url, isLive) {
    if (hls) {
      hls.destroy();
      hls = null;
    }

    if (isLive && Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 2, maxLiveSyncPlaybackRate: 1.5 });
      hls.loadSource(url);
      hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(() => {}));
    } else if (isLive && audio.canPlayType("application/vnd.apple.mpegurl")) {
      audio.src = url;
      audio.play().catch(() => {});
    } else {
      audio.src = url;
      audio.play().catch(() => {});
    }
  }

  // Boot into live stream
  playLive();
</script>
</body>
</html>
