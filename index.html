<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIR Rainbow - Live & 12h Slices</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    :root {
      --bg: #0f141c;
      --card: #18202c;
      --accent: #238636;
      --blue: #388bfd;
      --live-red: #ff3b30;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { max-width: 850px; width: 100%; display: flex; flex-direction: column; gap: 16px; }

    header { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 12px; }
    h1 { font-size: 1.3rem; margin-bottom: 4px; }
    p.sub { font-size: 0.85rem; color: var(--text-muted); }

    .player-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    
    /* YouTube-style Live Pill */
    .player-top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .live-indicator-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      padding: 5px 12px; border-radius: 20px; cursor: pointer;
      border: 1px solid transparent; background: #262c36; color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .live-indicator-btn .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted);
    }
    /* When actually playing live */
    .live-indicator-btn.active {
      background: rgba(255, 59, 48, 0.15);
      border-color: rgba(255, 59, 48, 0.4);
      color: var(--live-red);
    }
    .live-indicator-btn.active .dot {
      background: var(--live-red);
      box-shadow: 0 0 8px var(--live-red);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .mode-label { font-size: 0.75rem; color: var(--text-muted); }

    audio { width: 100%; margin: 12px 0; }

    .controls-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button.btn {
      background: #21262d; border: 1px solid var(--border); color: #fff;
      padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: 0.2s;
    }
    button.btn:hover:not(:disabled) { background: #30363d; }
    button.btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Timeline Sweeper */
    .section-title { font-size: 0.95rem; font-weight: 600; margin: 16px 0 10px; color: var(--text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .hour-pill {
      background: #1c2430; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 6px; text-align: center; cursor: pointer; color: var(--text);
      transition: all 0.2s;
    }
    .hour-pill:hover { border-color: var(--blue); }
    .hour-pill.active { background: var(--blue); color: #fff; font-weight: bold; border-color: #58a6ff; }
    .hour-pill span.hour { font-size: 0.82rem; display: block; }
    .hour-pill span.sub { font-size: 0.68rem; color: var(--text-muted); }
    .hour-pill.active span.sub { color: #d0e2ff; }

    /* Custom Input */
    .stream-add { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    input[type="text"] {
      flex: 1; min-width: 200px; background: #0b0e14; border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 6px; color: #fff; font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>AIR FM Rainbow 102.6</h1>
    <p class="sub">Continuous cloud recording &amp; 1-hour archive player (07:00 AM &ndash; 07:00 PM IST)</p>
  </header>

  <div class="player-card">
    <div class="player-top-bar">
      <!-- YouTube-style Live Button -->
      <button id="liveBtn" class="live-indicator-btn active" onclick="switchToLive()">
        <span class="dot"></span> LIVE
      </button>
      <span id="modeStatus" class="mode-label">Mode: Real-time broadcast</span>
    </div>

    <h2 id="trackTitle" style="font-size: 1.1rem; color: #fff;">AIR FM Rainbow Live Stream</h2>
    <audio id="player" controls autoplay></audio>

    <div class="controls-row">
      <!-- Sweep next is ONLY active in Archive Mode, disabled in Live -->
      <button id="sweepNextBtn" class="btn" onclick="sweepNextHour()" disabled title="Available when listening to recorded hours">
        Sweep to Next Hour &rarr;
      </button>
    </div>
  </div>

  <!-- 1-Hour Slices Grid (7 AM - 7 PM) -->
  <div>
    <div class="section-title">Recorded Playback Slices (Click an hour to play archive)</div>
    <div class="grid" id="hoursGrid"></div>
  </div>

  <!-- Custom Stream Box -->
  <div class="player-card">
    <div class="section-title" style="margin-top:0;">Add Custom Stream URL</div>
    <div class="stream-add">
      <input type="text" id="custName" placeholder="Name (e.g. Vividh Bharati)">
      <input type="text" id="custUrl" placeholder="Stream link (.m3u8, .mp3)">
      <button class="btn" style="background:var(--accent); border-color:var(--accent);" onclick="playCustom()">Play</button>
    </div>
  </div>
</div>

<script>
  const RAINBOW_LIVE = "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8";
  const player = document.getElementById("player");
  const liveBtn = document.getElementById("liveBtn");
  const modeStatus = document.getElementById("modeStatus");
  const trackTitle = document.getElementById("trackTitle");
  const sweepNextBtn = document.getElementById("sweepNextBtn");
  let hls = null;
  let currentHourIndex = -1; // -1 means currently playing LIVE

  const slots = [
    { label: "07 - 08 AM", file: "hour_00.mp3" },
    { label: "08 - 09 AM", file: "hour_01.mp3" },
    { label: "09 - 10 AM", file: "hour_02.mp3" },
    { label: "10 - 11 AM", file: "hour_03.mp3" },
    { label: "11 - 12 PM", file: "hour_04.mp3" },
    { label: "12 - 01 PM", file: "hour_05.mp3" },
    { label: "01 - 02 PM", file: "hour_06.mp3" },
    { label: "02 - 03 PM", file: "hour_07.mp3" },
    { label: "03 - 04 PM", file: "hour_08.mp3" },
    { label: "04 - 05 PM", file: "hour_09.mp3" },
    { label: "05 - 06 PM", file: "hour_10.mp3" },
    { label: "06 - 07 PM", file: "hour_11.mp3" }
  ];

  // Render hour blocks
  const grid = document.getElementById("hoursGrid");
  slots.forEach((s, idx) => {
    const d = document.createElement("div");
    d.className = "hour-pill";
    d.id = "slot-" + idx;
    d.innerHTML = `<span class="hour">${s.label}</span><span class="sub">Hour ${idx+1}</span>`;
    d.onclick = () => switchToArchive(idx);
    grid.appendChild(d);
  });

  // Switch to LIVE mode
  function switchToLive() {
    currentHourIndex = -1;
    clearGridHighlights();

    liveBtn.classList.add("active");
    modeStatus.innerText = "Mode: Real-time broadcast";
    trackTitle.innerText = "AIR FM Rainbow Live Stream";
    
    // Disable hour sweep because you are listening to live
    sweepNextBtn.disabled = true;

    loadAudio(LIVE_STREAM);
  }

  // Switch to ARCHIVE (Recorded) mode
  function switchToArchive(index) {
    currentHourIndex = index;
    clearGridHighlights();

    document.getElementById("slot-" + index).classList.add("active");
    liveBtn.classList.remove("active"); // Turn off red LIVE pill
    modeStatus.innerText = "Mode: Archive Playback";
    trackTitle.innerText = `Recording: ${slots[index].label} (Hour ${index+1})`;

    // Enable sweeping between hours
    sweepNextBtn.disabled = false;

    // Load segment (matches GitHub release output files)
    const url = `./recordings/${slots[index].file}`;
    loadAudio(url);
  }

  // Sweep to the next recorded hour
  function sweepNextHour() {
    if (currentHourIndex >= 0 && currentHourIndex < slots.length - 1) {
      switchToArchive(currentHourIndex + 1);
    } else if (currentHourIndex === slots.length - 1) {
      alert("Reached the last recorded block (06:00 - 07:00 PM).");
    }
  }

  // Auto-sweep to next hour when current recording finishes
  player.addEventListener("ended", () => {
    if (currentHourIndex >= 0 && currentHourIndex < slots.length - 1) {
      switchToArchive(currentHourIndex + 1);
    }
  });

  function clearGridHighlights() {
    document.querySelectorAll(".hour-pill").forEach(el => el.classList.remove("active"));
  }

  function loadAudio(source) {
    if (source.endsWith(".m3u8") && Hls.isSupported()) {
      if (hls) hls.destroy();
      hls = new Hls();
      hls.loadSource(source);
      hls.attachMedia(player);
      hls.on(Hls.Events.MANIFEST_PARSED, () => player.play().catch(() => {}));
    } else {
      if (hls) { hls.destroy(); hls = null; }
      player.src = source;
      player.play().catch(() => {});
    }
  }

  function playCustom() {
    const url = document.getElementById("custUrl").value.trim();
    const name = document.getElementById("custName").value.trim() || "Custom Radio";
    if (!url) return;
    currentHourIndex = -1;
    clearGridHighlights();
    liveBtn.classList.remove("active");
    modeStatus.innerText = "Mode: Custom Stream";
    trackTitle.innerText = name;
    sweepNextBtn.disabled = true;
    loadAudio(url);
  }

  // Start with live radio on load
  switchToLive();
</script>
</body>
</html>
