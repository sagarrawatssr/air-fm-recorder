<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AIR FM Rainbow Delhi (102.6 MHz)</title>

  <!-- HLS.js for Live Stream -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --accent-blue: #2563eb;
      --accent-blue-glow: rgba(37, 99, 235, 0.4);
      --live-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 14px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    .title-area h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .title-area p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .freq-badge {
      background: #1e293b;
      color: #60a5fa;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid #2563eb40;
    }

    /* Master Top Button */
    .master-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: var(--accent-blue);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--accent-blue-glow);
    }

    /* Player Console Card */
    .player-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .mode-indicators {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.12);
      color: var(--live-red);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--live-red);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--live-red);
    }

    .btn-go-live {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: #f8fafc;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-go-live:active {
      background: var(--accent-blue);
    }

    .track-meta h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .track-meta p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* YouTube Touch & Gesture Screen / Waveform Display */
    .gesture-screen {
      width: 100%;
      height: 52px;
      background: #0f172a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    .wave-bar {
      flex: 1;
      max-width: 6px;
      height: 8px;
      background: #38bdf8;
      border-radius: 3px;
      transition: height 0.12s ease;
      pointer-events: none;
    }

    .gesture-screen.playing .wave-bar {
      animation: pulse 1s infinite alternate ease-in-out;
    }

    @keyframes pulse {
      0% { height: 8px; }
      100% { height: 36px; }
    }

    /* Gesture Overlay Pill */
    .gesture-pill {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(37, 99, 235, 0.95);
      color: #ffffff;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-out;
      z-index: 10;
    }

    /* YouTube Scrubber Playbar */
    .timeline-scrubber {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-blue);
      border-radius: 4px;
      pointer-events: none;
      position: relative;
    }

    .progress-scrubber-handle {
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      right: -7px;
      top: -3px;
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
      pointer-events: none;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Control Buttons */
    .control-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 4px 0;
    }

    .seek-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.72rem;
      gap: 4px;
      padding: 10px;
      border-radius: 50%;
    }

    .seek-btn:active {
      color: #fff;
      background: #1e293b;
    }

    .seek-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .play-btn-round {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--accent-blue);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-blue-glow);
    }

    .play-btn-round svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* Rate & Volume */
    .sub-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .vol-slider {
      flex: 1;
      accent-color: #fff;
      height: 4px;
    }

    .speed-btn {
      background: #1e293b;
      border: none;
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Error Notice Box */
    .alert-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px 14px;
      border-radius: 12px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .alert-box p {
      font-size: 0.78rem;
      color: #fca5a5;
    }

    /* Date Navigation */
    .date-pill-group {
      display: flex;
      gap: 8px;
    }

    .date-pill {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .date-pill.active {
      background: var(--accent-blue);
      color: #fff;
    }

    .date-navigator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #131b2e;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .nav-arrow {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .date-display {
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Slot Cards */
    .timeline-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    .slot-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .slot-card {
      min-width: 125px;
      background: #131b2e;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .slot-card.active {
      border-color: var(--accent-blue);
      background: rgba(37, 99, 235, 0.12);
    }

    .slot-card .header {
      font-size: 0.7rem;
      color: var(--accent-blue);
      font-weight: 700;
    }

    .slot-card .time {
      font-size: 0.88rem;
      font-weight: 700;
    }

    .slot-card .desc {
      font-size: 0.68rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-bar">
      <div class="title-area">
        <h1>AIR FM Rainbow</h1>
        <p>Delhi • Live & 30-Day Archive</p>
      </div>
      <div class="freq-badge">102.6 MHz</div>
    </div>

    <!-- Master Button -->
    <button class="master-btn" id="master-btn" onclick="togglePlay()">
      <span id="master-btn-icon">▶</span> <span id="master-btn-text">Tap to Start AIR FM Rainbow Radio</span>
    </button>

    <!-- Player Console -->
    <div class="player-card">
      <div class="mode-indicators">
        <div class="live-tag" id="live-badge">
          <span class="live-dot"></span> LIVE
        </div>
        <button class="btn-go-live" onclick="switchToLiveEdge()">
          <span style="color: var(--live-red); font-size: 1rem;">●</span> Switch to Live
        </button>
      </div>

      <div class="track-meta">
        <h2 id="player-title">FM Rainbow: Live Stream</h2>
        <p id="player-sub">All India Radio • 102.6 MHz FM</p>
      </div>

      <!-- Gesture Screen: Tap Left/Right (10s), Double Tap (20s), Touch & Hold (Continuous 2x/Fast Seek) -->
      <div class="gesture-screen" id="gesture-screen">
        <div class="gesture-pill" id="gesture-pill">10s</div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      </div>

      <!-- YouTube Style Interactive Scrubber Bar -->
      <div class="timeline-scrubber">
        <div class="progress-bar-bg" id="progress-container">
          <div class="progress-bar-fill" id="progress-fill">
            <div class="progress-scrubber-handle"></div>
          </div>
        </div>
        <div class="time-labels">
          <span id="time-current">00:00</span>
          <span id="time-total">00:00</span>
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="control-row">
        <button class="seek-btn" id="btn-seek-back">
          <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.2 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
          <span>-10s</span>
        </button>

        <button class="play-btn-round" onclick="togglePlay()">
          <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>

        <button class="seek-btn" id="btn-seek-forward">
          <svg viewBox="0 0 24 24"><path d="M10 12.5c0 .28-.22.5-.5.5s-.5-.22-.5-.5.22-.5.5-.5.5.22.5.5zm8.9-1.9C17.05 8.99 14.65 8 12 8c-4.65 0-8.58 3.03-9.97 7.22l2.37.78C5.45 12.81 8.46 10.5 12 10.5c1.96 0 3.73.68 5.12 1.88L13.5 16H22.5V7l-3.6 3.6z"/></svg>
          <span>+10s</span>
        </button>
      </div>

      <!-- Volume & Speed Buttons -->
      <div class="sub-controls">
        <span style="font-size: 0.8rem;">🔊</span>
        <input type="range" class="vol-slider" min="0" max="1" step="0.05" value="1" oninput="audio.volume = this.value">
        <button class="speed-btn" id="speed-btn" onclick="cycleSpeed()">1x</button>
      </div>
    </div>

    <!-- Alert Box -->
    <div class="alert-box" id="error-box">
      <p id="error-msg">Recording not found. It may still be recording or expired.</p>
    </div>

    <!-- Date Selectors -->
    <div class="date-pill-group">
      <button class="date-pill active" onclick="selectQuickDate(0, this)">Today</button>
      <button class="date-pill" onclick="selectQuickDate(1, this)">Yesterday</button>
      <button class="date-pill" onclick="selectQuickDate(2, this)">2 Days Ago</button>
    </div>

    <div class="date-navigator">
      <button class="nav-arrow" onclick="adjustDate(-1)">❮</button>
      <span class="date-display" id="date-label"></span>
      <button class="nav-arrow" onclick="adjustDate(1)">❯</button>
    </div>

    <!-- Slot Carousel -->
    <div class="timeline-title">
      <span>HOURLY TIMELINE (07 AM – 07 PM IST)</span>
      <span>Sweep Next →</span>
    </div>
    <div class="slot-scroll" id="slot-container"></div>
  </div>

  <audio id="native-audio" preload="none"></audio>

  <script>
    const STREAM_URL = "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8";
    const GITHUB_BASE = "https://github.com/sagarrawatssr/air-fm-recorder/releases/download";

    const audio = document.getElementById("native-audio");
    const playIcon = document.getElementById("play-icon");
    const pauseIcon = document.getElementById("pause-icon");
    const masterBtnText = document.getElementById("master-btn-text");
    const playerTitle = document.getElementById("player-title");
    const playerSub = document.getElementById("player-sub");
    const liveBadge = document.getElementById("live-badge");
    const errorBox = document.getElementById("error-box");
    const errorMsg = document.getElementById("error-msg");
    const gestureScreen = document.getElementById("gesture-screen");
    const gesturePill = document.getElementById("gesture-pill");
    const progressContainer = document.getElementById("progress-container");
    const progressFill = document.getElementById("progress-fill");
    const timeCurrent = document.getElementById("time-current");
    const timeTotal = document.getElementById("time-total");

    let hls = null;
    let isLive = true;
    let currentDate = new Date();

    const SLOTS = [
      { id: "00", name: "SLOT 1", time: "07 - 08 AM" },
      { id: "01", name: "SLOT 2", time: "08 - 09 AM" },
      { id: "02", name: "SLOT 3", time: "09 - 10 AM" },
      { id: "03", name: "SLOT 4", time: "10 - 11 AM" },
      { id: "04", name: "SLOT 5", time: "11 AM - 12 PM" },
      { id: "05", name: "SLOT 6", time: "12 - 01 PM" },
      { id: "06", name: "SLOT 7", time: "01 - 02 PM" },
      { id: "07", name: "SLOT 8", time: "02 - 03 PM" },
      { id: "08", name: "SLOT 9", time: "03 - 04 PM" },
      { id: "09", name: "SLOT 10", time: "04 - 05 PM" },
      { id: "10", name: "SLOT 11", time: "05 - 06 PM" },
      { id: "11", name: "SLOT 12", time: "06 - 07 PM" }
    ];

    function togglePlay() {
      if (audio.paused) {
        if (!audio.src && isLive) {
          switchToLiveEdge();
        } else {
          audio.play().catch(e => console.log(e));
        }
      } else {
        audio.pause();
      }
    }

    function switchToLiveEdge() {
      isLive = true;
      liveBadge.style.display = "inline-flex";
      playerTitle.textContent = "FM Rainbow: Live Stream";
      playerSub.textContent = "All India Radio • 102.6 MHz FM";
      document.querySelectorAll(".slot-card").forEach(c => c.classList.remove("active"));
      errorBox.style.display = "none";

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({
          liveSyncDurationCount: 1,
          liveMaxLatencyDurationCount: 2,
          enableWorker: true
        });
        hls.loadSource(STREAM_URL + "?ts=" + Date.now());
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          audio.play().catch(() => {});
        });
      } else {
        audio.src = STREAM_URL + "?ts=" + Date.now();
        audio.play().catch(() => {});
      }
    }

    function playSlot(slotId, card) {
      isLive = false;

      if (hls) {
        hls.destroy();
        hls = null;
      }

      document.querySelectorAll(".slot-card").forEach(c => c.classList.remove("active"));
      card.classList.add("active");

      liveBadge.style.display = "none";

      const dateStr = getFormattedDate(currentDate, "YYYY-MM-DD");
      const matchedSlot = SLOTS.find(s => s.id === slotId);
      playerTitle.textContent = `FM Rainbow: ${matchedSlot.time}`;
      playerSub.textContent = `Recorded Archive • ${dateStr}`;

      const targetFile = `${dateStr}_hour_${slotId}.mp3`;
      const fileUrl = `${GITHUB_BASE}/archive-${dateStr}/${targetFile}`;

      audio.src = fileUrl;
      audio.load();
      audio.play().then(() => {
        errorBox.style.display = "none";
      }).catch(() => {
        errorMsg.textContent = `Recording not found (${targetFile}). It may still be recording or expired.`;
        errorBox.style.display = "flex";
        syncUi(false);
      });
    }

    audio.addEventListener("play", () => syncUi(true));
    audio.addEventListener("pause", () => syncUi(false));

    function syncUi(playing) {
      if (playing) {
        playIcon.style.display = "none";
        pauseIcon.style.display = "block";
        masterBtnText.textContent = "Pause Broadcast";
        gestureScreen.classList.add("playing");
      } else {
        playIcon.style.display = "block";
        pauseIcon.style.display = "none";
        masterBtnText.textContent = isLive ? "Tap to Start AIR FM Rainbow Radio" : "Play Recording";
        gestureScreen.classList.remove("playing");
      }
    }

    // Time & Scrubber Tracker
    audio.addEventListener("timeupdate", () => {
      if (!isLive && audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + "%";
        timeCurrent.textContent = formatSec(audio.currentTime);
        timeTotal.textContent = formatSec(audio.duration);
      } else {
        progressFill.style.width = "100%";
        timeCurrent.textContent = "LIVE";
        timeTotal.textContent = "LIVE";
      }
    });

    function formatSec(s) {
      if (isNaN(s)) return "00:00";
      const min = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    // YouTube Scrubber Drag & Click
    let isScrubbing = false;
    function seekFromEvent(e) {
      if (isLive || !audio.duration) return;
      const rect = progressContainer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
    }

    progressContainer.addEventListener("mousedown", (e) => { isScrubbing = true; seekFromEvent(e); });
    progressContainer.addEventListener("touchstart", (e) => { isScrubbing = true; seekFromEvent(e); });
    window.addEventListener("mousemove", (e) => { if (isScrubbing) seekFromEvent(e); });
    window.addEventListener("touchmove", (e) => { if (isScrubbing) seekFromEvent(e); });
    window.addEventListener("mouseup", () => { isScrubbing = false; });
    window.addEventListener("touchend", () => { isScrubbing = false; });

    // YouTube Double-Tap, Touch & Hold, and Screen Seek
    let lastTap = 0;
    let holdTimeout = null;
    let holdInterval = null;

    function showPill(txt) {
      gesturePill.textContent = txt;
      gesturePill.style.opacity = "1";
      setTimeout(() => { gesturePill.style.opacity = "0"; }, 650);
    }

    function seekRelative(sec) {
      if (isLive || !audio.duration) return;
      audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec));
      showPill(sec > 0 ? `+${sec}s` : `${sec}s`);
    }

    gestureScreen.addEventListener("touchstart", (e) => {
      if (isLive) return;
      const rect = gestureScreen.getBoundingClientRect();
      const touchX = e.touches[0].clientX - rect.left;
      const isRightSide = touchX > rect.width / 2;
      const delta = isRightSide ? 10 : -10;

      // Double tap check (< 300ms)
      const now = Date.now();
      if (now - lastTap < 300) {
        clearTimeout(holdTimeout);
        seekRelative(delta * 2);
        lastTap = 0;
        return;
      }
      lastTap = now;

      // Touch and Hold to fast-seek continuous
      holdTimeout = setTimeout(() => {
        showPill(isRightSide ? "Fast-Forward ⏩" : "Rewind ⏪");
        holdInterval = setInterval(() => {
          seekRelative(delta * 1.5);
        }, 220);
      }, 350);
    });

    const stopGesture = () => {
      clearTimeout(holdTimeout);
      clearInterval(holdInterval);
    };
    gestureScreen.addEventListener("touchend", stopGesture);
    gestureScreen.addEventListener("touchcancel", stopGesture);

    // Seek Buttons
    function bindButtonSeek(btn, delta) {
      let bTimer = null;
      let bLoop = null;

      btn.addEventListener("click", () => seekRelative(delta));
      btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        bTimer = setTimeout(() => {
          bLoop = setInterval(() => seekRelative(delta), 200);
        }, 300);
      });
      const end = () => {
        clearTimeout(bTimer);
        clearInterval(bLoop);
      };
      btn.addEventListener("touchend", end);
      btn.addEventListener("touchcancel", end);
    }

    bindButtonSeek(document.getElementById("btn-seek-back"), -10);
    bindButtonSeek(document.getElementById("btn-seek-forward"), 10);

    // Speed Controls
    const speeds = [1, 1.25, 1.5, 2];
    let spdIndex = 0;
    function cycleSpeed() {
      spdIndex = (spdIndex + 1) % speeds.length;
      audio.playbackRate = speeds[spdIndex];
      document.getElementById("speed-btn").textContent = speeds[spdIndex] + "x";
    }

    // Dates & Slots
    function getFormattedDate(d, format) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      if (format === "YYYY-MM-DD") return `${year}-${month}-${day}`;
      return `${day}/${month}/${year}`;
    }

    function renderSlots() {
      const container = document.getElementById("slot-container");
      container.innerHTML = "";
      SLOTS.forEach(slot => {
        const card = document.createElement("div");
        card.className = "slot-card";
        card.innerHTML = `
          <div class="header">${slot.name}</div>
          <div class="time">${slot.time}</div>
          <div class="desc">Recorded Hour</div>
        `;
        card.onclick = () => playSlot(slot.id, card);
        container.appendChild(card);
      });
    }

    function updateDateUI() {
      document.getElementById("date-label").textContent = getFormattedDate(currentDate, "DD/MM/YYYY");
      renderSlots();
    }

    function adjustDate(offset) {
      currentDate.setDate(currentDate.getDate() + offset);
      document.querySelectorAll(".date-pill").forEach(p => p.classList.remove("active"));
      updateDateUI();
    }

    function selectQuickDate(offset, pill) {
      currentDate = new Date();
      currentDate.setDate(currentDate.getDate() - offset);
      document.querySelectorAll(".date-pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      updateDateUI();
    }

    updateDateUI();
  </script>
</body>
</html>
